name: Fix real-device calculator overlap and composition
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ui-real-review-fix.yml"
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply critical presentation fixes
        shell: bash
        run: |
          printf '%s' ' ' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
      - name: Validate JavaScript and responsive flows
        shell: bash
        run: |
          python -c "import re,pathlib;s=pathlib.Path('index.html').read_text(encoding='utf-8');x=[z for z in re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',s,re.S) if z.strip()];pathlib.Path('/tmp/app.js').write_text(x[-1],encoding='utf-8')"
          node --check /tmp/app.js
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium webkit >/dev/null
          python -m http.server 8000 >/tmp/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          printf '%s' ' fX0pOwogIGF3YWl0IHAucm91dGUoJ2h0dHBzOi8vcmF3LmdpdGh1YnVzZXJjb250ZW50LmNvbS8qKics  ,' | base64 -d > /tmp/verify.cjs
          node /tmp/verify.cjs
          printf '%s' 'CmNvbnN0IGZzPXJlcXVpcmUoJ2ZzJyks  fX0pOwogICAgYXdhaXQgcC5yb3V0ZSgnaHR0cHM6Ly9yYXcuZ2l0aHVidXNlcmNvbnRlbnQuY29tLyoqJyx yPT5yLmZ1bGZpbGw   fS1yZXBsYWNlLnBuZ2AsZnVsbFBhZ2U6ZmFsc2V9KTt9CiAgICBhd2FpdCBwLmNsb3NlKCk7CiAgfQogIGF3YWl0IGIuY2xvc2UoKTsKfSkoKS5jYXRjaChlPT57Y29uc29sZS5lcnJvcihlKTtwcm9jZXNzLmV4aXQoMSl9KTsK' | base64 -d > /tmp/capture.cjs
          node /tmp/capture.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: ui-critical-final-review
          path: /tmp/final
          retention-days: 1
      - name: Commit verified fixes
        shell: bash
        run: |
          rm -rf node_modules package.json package-lock.json
          git rm -f .github/workflows/ui-real-review-fix.yml .github/workflows/ui-visual-review.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix mobile calculator overlap and mockup composition"
          git push origin HEAD:main
