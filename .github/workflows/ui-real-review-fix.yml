name: Apply real-device UI review fixes
on:
  push:
    branches: [main]
    paths: [".github/workflows/ui-real-review-fix.yml"]
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Patch presentation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          marker='/* REAL DEVICE REVIEW OVERRIDES 2026-09-23 */'
          if marker in s: raise SystemExit('override already applied')
          old='ระบบคำนวณวัตถุดิบสุทธิ (จัดลำดับ Default เลือกตัวแทนหมวดเดียวกันอัตโนมัติ)'
          s=s.replace(old,'ระบบคำนวณวัตถุดิบสุทธิ สำหรับร้านแจ่วฮ้อน',1)
          css=r'''
/* REAL DEVICE REVIEW OVERRIDES 2026-09-23 */
#decor-layer{position:absolute!important;inset:0 0 auto 0!important;height:960px!important;overflow:hidden!important;pointer-events:none!important;z-index:3!important}
#decor-layer:before,#decor-layer:after{display:none!important}
.decor-person{position:absolute!important;display:block!important;background-image:url('assets/ner-team-bg.webp')!important;background-repeat:no-repeat!important;background-size:540px 360px!important;opacity:1!important;filter:none!important;-webkit-mask-image:none!important;mask-image:none!important;pointer-events:none!important;overflow:hidden!important}
.decor-a{width:175px!important;height:200px!important;left:0!important;right:auto!important;top:54px!important;bottom:auto!important;background-position:0 0!important;transform:scale(1.12)!important;transform-origin:top left!important}
.decor-b{width:178px!important;height:190px!important;left:0!important;right:auto!important;top:625px!important;bottom:auto!important;background-position:0 -170px!important;transform:scale(1.08)!important;transform-origin:top left!important}
.decor-c{width:160px!important;height:280px!important;left:auto!important;right:0!important;top:520px!important;bottom:auto!important;background-position:-380px -80px!important;transform:scale(1.05)!important;transform-origin:top right!important}
#app-shell{position:relative!important;z-index:20!important}.brand-masthead{position:relative!important;z-index:1!important}.hero,#app-menus{position:relative!important;z-index:4!important}
@media(max-width:767px){
#decor-layer{height:930px!important}#app-shell{width:100%!important;padding-top:max(8px,env(safe-area-inset-top))!important}.brand-masthead{width:100%!important;min-height:188px!important;margin:0 auto 4px!important;padding:0 42px 0 86px!important}.brand-mark{font-size:61px!important;line-height:.86!important}.brand-thai{font-size:24px!important;margin-top:5px!important}.brand-english{font-size:8.5px!important;margin-top:7px!important}.brand-note{font-size:10px!important;margin-top:9px!important;white-space:nowrap!important}
.hero{width:min(330px,calc(100% - 48px))!important;padding:17px 16px!important;border-radius:25px!important}.hero-row{gap:13px!important}.brand-title{font-size:18px!important;line-height:1.25!important;white-space:nowrap!important}.brand-title .accent{display:inline!important;margin:0!important}.brand-subtitle{font-size:10.5px!important;line-height:1.45!important;margin-top:7px!important}.manager-btn{min-height:48px!important;font-size:12px!important;border-radius:15px!important;padding:0 14px!important}
#app-menus{width:min(302px,calc(100% - 76px))!important;margin:18px auto 0!important}.category-block{margin-bottom:23px!important}.category-title{font-size:18px!important;margin-bottom:9px!important;padding:3px 0 7px!important}.category-icon{width:27px!important;height:27px!important;font-size:14px!important}.menu-grid{grid-template-columns:1fr!important;gap:7px!important}.menu-card{min-height:58px!important;padding:5px 8px!important;gap:9px!important;border-radius:15px!important}.menu-card:before{width:47px!important;height:47px!important;flex-basis:47px!important;border-radius:12px!important;font-size:23px!important}.menu-card-title{font-size:12.5px!important;line-height:1.25!important}.menu-card-subtitle{display:none!important}.menu-arrow{font-size:24px!important}
.decor-a{left:0!important;top:54px!important;transform:scale(1.10)!important}.decor-b{left:-2px!important;top:635px!important;transform:scale(1.04)!important}.decor-c{right:-1px!important;top:535px!important;transform:scale(1.02)!important}
.calculator-body{display:flex!important;flex-direction:column!important;overflow-y:auto!important;overflow-x:hidden!important;min-height:0!important}.calc-panel{flex:0 0 auto!important;min-height:auto!important;overflow:visible!important;position:relative!important;width:100%!important}#leftPanel{z-index:2!important;border-right:0!important;border-bottom:1px solid #eddfd3!important}#rightPanel{z-index:1!important;flex:0 0 auto!important}.panel-title{font-size:12px!important;margin-bottom:11px!important}.exclude-item{margin-bottom:7px!important}.exclude-btn{min-height:45px!important;padding:9px 11px!important;border-radius:13px!important;font-size:13px!important}.replacement-wrap{margin:7px 0 3px!important;padding-left:7px!important}.replacement-trigger{min-height:44px!important;padding:8px 10px!important;font-size:12.5px!important}.replacement-menu{position:static!important;max-height:none!important;overflow:visible!important;margin-top:6px!important}.replacement-option{min-height:43px!important;padding:9px 11px!important;font-size:12.5px!important}#netResultList{grid-template-columns:1fr!important;gap:7px!important}.net-card{min-height:49px!important;padding:9px 11px!important}.net-qty{font-size:18px!important}
#tableContainer{--matrix-col-1:76px!important;--matrix-col-2:80px!important;--matrix-data-col:48px!important}.matrix-table{font-size:8px!important}.matrix-table th{font-size:7px!important}}
@media(min-width:768px) and (max-width:1023px){
#decor-layer{height:1180px!important}#app-shell{width:min(760px,calc(100% - 36px))!important}.brand-masthead{min-height:205px!important;width:min(560px,100%)!important}.hero{width:min(600px,100%)!important;padding:24px 28px!important}.brand-title{font-size:27px!important}#app-menus{width:min(650px,100%)!important;margin-top:24px!important}.menu-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:10px!important}.menu-card{min-height:72px!important;padding:8px 10px!important}.menu-card:before{width:52px!important;height:52px!important;flex-basis:52px!important;font-size:25px!important}.menu-card-title{font-size:14px!important}.menu-card-subtitle{font-size:9.5px!important}.decor-a{left:0!important;top:82px!important;transform:scale(1.52)!important}.decor-b{left:0!important;top:760px!important;transform:scale(1.40)!important}.decor-c{right:0!important;top:620px!important;transform:scale(1.42)!important}
.calculator-body{display:flex!important;flex-direction:column!important;overflow-y:auto!important;overflow-x:hidden!important}.calc-panel{flex:0 0 auto!important;min-height:auto!important;overflow:visible!important;position:relative!important;width:100%!important}#leftPanel{z-index:2!important;border-right:0!important;border-bottom:1px solid #eddfd3!important}#rightPanel{z-index:1!important}.replacement-menu{position:static!important;max-height:none!important;overflow:visible!important}#netResultList{grid-template-columns:repeat(2,minmax(0,1fr))!important}#tableContainer{--matrix-col-1:88px!important;--matrix-col-2:92px!important;--matrix-data-col:50px!important}}
@media(min-width:1024px){
#decor-layer{height:900px!important}#app-shell{width:min(900px,calc(100% - 64px))!important}.brand-masthead{width:min(540px,100%)!important;min-height:172px!important;margin-bottom:10px!important}.brand-mark{font-size:69px!important}.brand-thai{font-size:28px!important}.brand-note{font-size:12px!important;margin-top:8px!important}.hero{width:min(620px,100%)!important;padding:22px 28px!important}.brand-title{font-size:28px!important}.brand-subtitle{font-size:12px!important}#app-menus{width:min(780px,100%)!important;margin-top:20px!important}.menu-grid{grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:10px!important}.menu-card{min-height:72px!important;padding:8px 10px!important}.menu-card:before{width:50px!important;height:50px!important;flex-basis:50px!important;font-size:24px!important}.menu-card-title{font-size:13.5px!important}.menu-card-subtitle{font-size:9px!important}.decor-a{left:0!important;top:70px!important;transform:scale(1.62)!important}.decor-b{left:0!important;top:500px!important;transform:scale(1.48)!important}.decor-c{right:0!important;top:370px!important;transform:scale(1.52)!important}#tableContainer{--matrix-col-1:98px!important;--matrix-col-2:100px!important;--matrix-data-col:54px!important}}
@media(min-width:1024px) and (min-aspect-ratio:4/3){.calculator-body{display:grid!important;grid-template-columns:minmax(0,44%) minmax(0,56%)!important;overflow:hidden!important}.calc-panel{min-height:0!important;overflow-y:auto!important;overflow-x:hidden!important;position:relative!important;width:auto!important}#leftPanel{z-index:1!important;border-right:1px solid #eddfd3!important;border-bottom:0!important}#rightPanel{z-index:1!important}.replacement-menu{position:static!important;max-height:230px!important;overflow-y:auto!important}}
'''
          s=s.replace('  </style>',css+'\n  </style>',1)
          for t in ('selectable: qty > 0','option.disabled = true','function calculateNetRecipe','function renderMatrixTable'):
              if t not in s: raise SystemExit('logic token missing: '+t)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Test responsive behavior
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8'); x=[z for z in re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S) if z.strip()]; Path('/tmp/app.js').write_text(x[-1],encoding='utf-8')
          PY
          node --check /tmp/app.js
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium webkit >/dev/null
          python -m http.server 8000 >/tmp/server.log 2>&1 &
          PID=$!; trap 'kill $PID || true' EXIT; sleep 2
          cat >/tmp/check.cjs <<'JS'
          const fs=require('fs'),assert=require('assert'),{chromium,webkit}=require(process.cwd()+'/node_modules/playwright');const recipe=fs.readFileSync('recipe_master.json','utf8');
          async function pageAt(b,w,h){const p=await b.newPage({viewport:{width:w,height:h}});await p.route('https://raw.githubusercontent.com/**',r=>r.fulfill({status:200,contentType:'application/json',body:recipe}));await p.goto('http://127.0.0.1:8000/',{waitUntil:'domcontentloaded'});await p.locator('.menu-card').first().waitFor();return p}
          async function flow(b,w,h){const p=await pageAt(b,w,h);const home=await p.evaluate(()=>({sw:document.documentElement.scrollWidth,iw:innerWidth,pos:getComputedStyle(document.querySelector('#decor-layer')).position,pe:getComputedStyle(document.querySelector('#decor-layer')).pointerEvents,hero:document.querySelector('.hero').getBoundingClientRect().width,menus:document.querySelector('#app-menus').getBoundingClientRect().width}));assert(home.sw<=home.iw+1);assert.equal(home.pos,'absolute');assert.equal(home.pe,'none');if(w<768){assert(home.hero<=332);assert(home.menus<=304)}await p.locator('.menu-card').first().click();await p.locator('#calculatorModal:not(.is-hidden)').waitFor();assert(await p.evaluate(()=>{const r=document.querySelector('#calculatorModal .modal-card').getBoundingClientRect();return r.left>=-1&&r.top>=-1&&r.right<=innerWidth+1&&r.bottom<=innerHeight+1}));if(w<1024){const q=await p.evaluate(()=>{const l=document.querySelector('#leftPanel').getBoundingClientRect(),r=document.querySelector('#rightPanel').getBoundingClientRect();return{lb:l.bottom,rt:r.top,d:getComputedStyle(document.querySelector('.calculator-body')).display}});assert.equal(q.d,'flex');assert(q.rt>=q.lb-2,`panel overlap ${w}x${h}`)}const e=p.locator('.exclude-btn').first();if(await e.count()){await e.click();await p.locator('.replacement-wrap').first().waitFor();assert(await p.evaluate(()=>{const r=document.querySelector('.exclude-item'),w=r?.querySelector('.replacement-wrap'),n=r?.nextElementSibling;return !r||!w||!n||w.getBoundingClientRect().bottom<=n.getBoundingClientRect().top+2}))}await p.locator('#closeCalculatorButton').click();await p.locator('#managerButton').click();await p.locator('#pinModal:not(.is-hidden)').waitFor();await p.locator('#cancelPinButton').click();await p.evaluate(()=>openMatrix());await p.locator('#matrixModal:not(.is-hidden) .matrix-table').waitFor();const m=await p.evaluate(()=>{const r=document.querySelector('#matrixModal .matrix-card').getBoundingClientRect(),s=document.querySelector('#tableContainer');s.scrollLeft=300;return{fit:r.left>=-1&&r.top>=-1&&r.right<=innerWidth+1&&r.bottom<=innerHeight+1,scroll:s.scrollWidth>s.clientWidth&&s.scrollLeft>0,page:document.documentElement.scrollWidth<=innerWidth+1}});assert(m.fit&&m.scroll&&m.page);await p.close();console.log('PASS',w+'x'+h)}
          async function rotate(b){const p=await pageAt(b,820,1180);await p.locator('.menu-card').first().click();assert.equal(await p.locator('.calculator-body').evaluate(e=>getComputedStyle(e).display),'flex');await p.setViewportSize({width:1180,height:820});await p.waitForTimeout(120);assert.equal(await p.locator('.calculator-body').evaluate(e=>getComputedStyle(e).display),'grid');await p.setViewportSize({width:820,height:1180});await p.waitForTimeout(120);assert.equal(await p.locator('.calculator-body').evaluate(e=>getComputedStyle(e).display),'flex');await p.close()}
          (async()=>{for(const [eng,sizes] of [[chromium,[[390,844],[820,1180],[1180,820],[1024,1366],[1366,1024]]],[webkit,[[390,844],[820,1180],[1180,820]]]]){const b=await eng.launch({headless:true});for(const x of sizes)await flow(b,...x);await rotate(b);await b.close()}})().catch(e=>{console.error(e);process.exit(1)})
          JS
          node /tmp/check.cjs
      - name: Capture final screenshots
        run: |
          mkdir -p /tmp/final-shots
          cat >/tmp/cap.cjs <<'JS'
          const fs=require('fs'),{chromium}=require(process.cwd()+'/node_modules/playwright');const recipe=fs.readFileSync('recipe_master.json','utf8');
          (async()=>{const b=await chromium.launch({headless:true});for(const [n,w,h] of [['iphone',390,844],['ipadp',820,1180],['ipadl',1180,820]]){const p=await b.newPage({viewport:{width:w,height:h}});await p.route('https://raw.githubusercontent.com/**',r=>r.fulfill({status:200,contentType:'application/json',body:recipe}));await p.goto('http://127.0.0.1:8000/');await p.locator('.menu-card').first().waitFor();await p.screenshot({path:`/tmp/final-shots/${n}-home.png`});await p.locator('.menu-card').first().click();await p.screenshot({path:`/tmp/final-shots/${n}-calc.png`});const e=p.locator('.exclude-btn').first();if(await e.count()){await e.click();await p.screenshot({path:`/tmp/final-shots/${n}-replace.png`})}await p.close()}await b.close()})().catch(e=>{console.error(e);process.exit(1)})
          JS
          node /tmp/cap.cjs
      - uses: actions/upload-artifact@v4
        with: {name: ui-final-review, path: /tmp/final-shots, retention-days: 1}
      - name: Commit reviewed UI
        run: |
          rm -rf node_modules package.json package-lock.json
          rm -f .github/workflows/ui-real-review-fix.yml .github/workflows/ui-visual-review.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/ui-real-review-fix.yml .github/workflows/ui-visual-review.yml
          git commit -m "Fix composition and mobile calculator from real-device review"
          git push origin HEAD:main
