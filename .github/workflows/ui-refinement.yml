name: Apply and verify responsive UI refinement

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ui-refinement.yml"

permissions:
  contents: write

jobs:
  refine-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch presentation layer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")
          marker = "/* UI TARGET OVERRIDES 2026-09-23 */"
          if marker in html:
              raise SystemExit("UI override marker already present; refusing duplicate patch")

          masthead_anchor = '  <main id="app-shell">\n    <section class="hero" aria-label="NER Smart Recipe">'
          masthead = '''  <main id="app-shell">
            <header class="brand-masthead" aria-label="NER แจ่วฮ้อน Smart Recipe">
              <div class="brand-mark">NER</div>
              <div class="brand-thai">แจ่วฮ้อน</div>
              <div class="brand-english">SMART RECIPE</div>
              <p class="brand-note">อร่อยได้ทุกวัน เพราะทีมนี้ดูแลอยู่ ♡</p>
            </header>
            <section class="hero" aria-label="NER Smart Recipe">'''
          if masthead_anchor not in html:
              raise SystemExit("masthead anchor not found")
          html = html.replace(masthead_anchor, masthead, 1)

          old_card = '''return `<button type="button" class="menu-card" data-menu="${escapeHtml(menuName)}">
                        <span>
                          <span class="menu-card-title">${escapeHtml(menuName)}</span>
                          <span class="menu-card-subtitle ${single ? 'single' : ''}" style="display:block">${single ? 'วัตถุดิบเดี่ยว' : 'จัดการสูตรตัดออก'}</span>
                        </span>
                        <span class="menu-arrow" aria-hidden="true">›</span>
                      </button>`;'''
          new_card = '''return `<button type="button" class="menu-card" data-menu="${escapeHtml(menuName)}">
                        <span class="menu-thumb" aria-hidden="true">🍲</span>
                        <span class="menu-copy">
                          <span class="menu-card-title">${escapeHtml(menuName)}</span>
                          <span class="menu-card-subtitle ${single ? 'single' : ''}" style="display:block">${single ? 'วัตถุดิบเดี่ยว · พร้อมจัดเสิร์ฟ' : 'ปรับวัตถุดิบ · จัดสรรง่าย'}</span>
                        </span>
                        <span class="menu-arrow" aria-hidden="true">›</span>
                      </button>`;'''
          if old_card not in html:
              raise SystemExit("menu card template anchor not found")
          html = html.replace(old_card, new_card, 1)

          css = r'''
            /* UI TARGET OVERRIDES 2026-09-23 */
            :root {
              --cream: #fff8ef;
              --cream-2: #f7eadc;
              --paper: rgba(255, 253, 249, .97);
              --paper-solid: #fffdf9;
              --brown: #6b4635;
              --brown-dark: #493128;
              --brown-soft: #9a7662;
              --line: #ead8c8;
              --line-strong: #dbc0aa;
              --green: #71855c;
              --green-soft: #edf3e8;
              --rose: #c86f78;
              --rose-soft: #fff0f1;
              --text: #3b312c;
              --muted: #8c8077;
              --shadow: 0 10px 28px rgba(86, 58, 42, .09);
              --shadow-strong: 0 24px 68px rgba(54, 36, 28, .24);
            }

            html { background: var(--cream); }
            body {
              min-height: 100vh;
              min-height: 100dvh;
              color: var(--text);
              background:
                radial-gradient(circle at 10% 10%, rgba(244, 215, 194, .42), transparent 24rem),
                radial-gradient(circle at 92% 18%, rgba(190, 211, 159, .28), transparent 25rem),
                radial-gradient(circle at 14% 88%, rgba(211, 226, 188, .24), transparent 22rem),
                linear-gradient(180deg, #fffaf3 0%, #fffdf8 46%, #fbf1e6 100%);
              overflow-x: clip;
            }

            #decor-layer {
              z-index: 4;
              overflow: hidden;
              pointer-events: none !important;
            }
            #decor-layer::before,
            #decor-layer::after {
              content: "";
              position: absolute;
              width: clamp(130px, 18vw, 260px);
              aspect-ratio: 1;
              border-radius: 50%;
              background:
                radial-gradient(ellipse at 35% 60%, rgba(115, 145, 82, .18) 0 24%, transparent 25%),
                radial-gradient(ellipse at 60% 40%, rgba(149, 171, 108, .16) 0 19%, transparent 20%);
              filter: blur(.2px);
              pointer-events: none;
            }
            #decor-layer::before { top: 4%; right: -5%; transform: rotate(22deg); }
            #decor-layer::after { bottom: 1%; left: -6%; transform: rotate(-18deg); }

            .decor-person {
              opacity: .97;
              filter: saturate(1.02) contrast(1.015);
              background-size: 760px auto;
              -webkit-mask-image: none;
              mask-image: none;
              pointer-events: none !important;
            }
            .decor-a {
              width: 255px;
              height: 340px;
              left: -48px;
              top: clamp(82px, 10vh, 132px);
              background-position: left top;
            }
            .decor-b {
              width: 236px;
              height: 315px;
              left: -52px;
              top: auto;
              bottom: 34px;
              background-position: left bottom;
            }
            .decor-c {
              width: 248px;
              height: 355px;
              right: -48px;
              top: auto;
              bottom: 18px;
              background-position: right center;
            }

            #app-shell {
              z-index: 20;
              width: min(940px, calc(100% - 32px));
              padding-top: max(18px, env(safe-area-inset-top));
              padding-bottom: calc(88px + env(safe-area-inset-bottom));
            }

            .brand-masthead {
              width: min(680px, 100%);
              min-height: clamp(150px, 21vw, 224px);
              margin: 0 auto 18px;
              display: flex;
              flex-direction: column;
              align-items: center;
              justify-content: center;
              text-align: center;
              color: var(--brown);
              position: relative;
            }
            .brand-mark {
              font-size: clamp(58px, 9vw, 92px);
              line-height: .86;
              font-weight: 800;
              letter-spacing: .04em;
              color: #76503f;
              text-shadow: 0 2px 0 rgba(255,255,255,.75);
            }
            .brand-thai {
              margin-top: 7px;
              font-size: clamp(24px, 4vw, 36px);
              line-height: 1;
              font-weight: 800;
              letter-spacing: .01em;
            }
            .brand-english {
              margin-top: 8px;
              font-size: clamp(10px, 1.7vw, 13px);
              line-height: 1;
              font-weight: 800;
              letter-spacing: .42em;
              color: #8d6553;
              padding-left: .42em;
            }
            .brand-note {
              margin: 14px 0 0;
              color: #a36e5c;
              font-size: clamp(12px, 1.8vw, 15px);
              font-weight: 600;
            }

            .hero {
              width: min(700px, 100%);
              margin: 0 auto;
              padding: clamp(22px, 4vw, 34px);
              border-color: rgba(230, 211, 193, .88);
              border-radius: 28px;
              background: rgba(255, 253, 250, .97);
              box-shadow: 0 16px 40px rgba(91, 59, 42, .10);
            }
            .hero-row {
              flex-direction: column;
              align-items: stretch;
              gap: 18px;
              text-align: center;
            }
            .brand-title {
              color: var(--brown-dark);
              font-size: clamp(25px, 4vw, 34px);
              letter-spacing: -.025em;
            }
            .brand-title .accent { color: var(--brown-dark); }
            .brand-subtitle {
              width: min(560px, 100%);
              margin: 10px auto 0;
              color: #87786f;
              font-size: 13px;
              line-height: 1.65;
            }
            .manager-btn {
              width: min(520px, 100%);
              min-height: 54px;
              margin: 0 auto;
              padding: 0 18px;
              border-radius: 16px;
              background: linear-gradient(135deg, #704c3b, #4a3027);
              box-shadow: 0 10px 24px rgba(73, 48, 38, .18);
              display: inline-flex;
              align-items: center;
              justify-content: center;
              gap: 8px;
            }
            .manager-btn::after {
              content: "›";
              margin-left: auto;
              font-size: 26px;
              font-weight: 500;
              line-height: 1;
            }
            .manager-btn:focus-visible,
            .menu-card:focus-visible,
            .exclude-btn:focus-visible,
            .replacement-trigger:focus-visible,
            .replacement-option:focus-visible,
            .close-btn:focus-visible,
            .matrix-actions button:focus-visible,
            .upload-label:focus-within {
              outline: 3px solid rgba(113, 133, 92, .35);
              outline-offset: 2px;
            }

            #app-menus {
              width: min(820px, 100%);
              margin: 28px auto 0;
            }
            .category-block { margin-bottom: 28px; }
            .category-title {
              width: fit-content;
              margin: 0 0 12px;
              padding: 5px 2px 9px;
              border: 0;
              border-bottom: 2px solid #dca58d;
              border-radius: 0;
              background: transparent;
              backdrop-filter: none;
              -webkit-backdrop-filter: none;
              font-size: 20px;
              color: #5d3d30;
            }
            .category-icon {
              width: 31px;
              height: 31px;
              background: #f1e2d3;
              font-size: 16px;
            }
            .menu-grid {
              grid-template-columns: repeat(2, minmax(0, 1fr));
              gap: 10px;
            }
            .menu-card {
              min-width: 0;
              min-height: 84px;
              padding: 10px 12px;
              gap: 11px;
              border-radius: 18px;
              border-color: #ebddd1;
              box-shadow: 0 6px 18px rgba(81, 57, 43, .055);
              background: rgba(255, 255, 255, .96);
            }
            .menu-thumb {
              width: 58px;
              height: 58px;
              flex: 0 0 58px;
              border-radius: 14px;
              display: grid;
              place-items: center;
              background:
                radial-gradient(circle at 32% 24%, rgba(255,255,255,.7), transparent 25%),
                linear-gradient(145deg, #f7dfc9, #eee7d2 55%, #dfe8cf);
              box-shadow: inset 0 0 0 1px rgba(156, 123, 103, .08);
              font-size: 28px;
            }
            .menu-copy { min-width: 0; flex: 1 1 auto; }
            .menu-card-title {
              display: block;
              overflow: hidden;
              text-overflow: ellipsis;
              white-space: nowrap;
              font-size: 15px;
              color: #3f312b;
            }
            .menu-card-subtitle {
              margin-top: 4px;
              overflow: hidden;
              text-overflow: ellipsis;
              white-space: nowrap;
              font-size: 10.5px;
              color: #9b8a7e;
            }
            .menu-arrow {
              width: auto;
              height: auto;
              flex: 0 0 auto;
              border-radius: 0;
              background: transparent;
              color: #715345;
              font-size: 28px;
            }

            .modal {
              padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
            }
            .modal-card {
              width: min(980px, 100%);
              max-height: calc(100vh - 20px);
              max-height: calc(100dvh - 20px);
              border-radius: 24px;
            }
            .modal-header {
              padding: 17px 19px;
              flex: 0 0 auto;
            }
            .modal-title { font-size: clamp(20px, 3vw, 24px); }
            .close-btn { width: 42px; height: 42px; flex-basis: 42px; }

            .calculator-body {
              display: flex;
              flex-direction: column;
              min-height: 0;
              overflow-y: auto;
              overscroll-behavior: contain;
            }
            .calc-panel {
              overflow: visible;
              padding: 18px;
            }
            #leftPanel {
              border-right: 0;
              border-bottom: 1px solid #eddfd3;
            }
            #rightPanel { background: #fbf5ed; }
            .exclude-item { margin-bottom: 9px; }
            .exclude-btn {
              min-height: 50px;
              padding: 11px 13px;
              border-radius: 14px;
            }
            .replacement-wrap {
              margin: 8px 0 4px;
              padding-left: 9px;
              border-left-width: 2px;
            }
            .replacement-trigger { min-height: 48px; }
            .replacement-menu {
              max-height: none;
              overflow: visible;
              box-shadow: 0 8px 20px rgba(73,49,38,.09);
            }
            #netResultList {
              grid-template-columns: repeat(2, minmax(0, 1fr));
              gap: 9px;
            }
            .net-card { min-height: 56px; padding: 11px 12px; }
            .net-name {
              white-space: normal;
              display: -webkit-box;
              -webkit-line-clamp: 2;
              -webkit-box-orient: vertical;
            }
            .net-qty { font-size: 20px; }

            .matrix-card {
              width: min(1280px, 98vw);
              height: min(94vh, 900px);
              height: min(94dvh, 900px);
              max-height: 94vh;
              max-height: 94dvh;
              border-radius: 20px;
            }
            #tableContainer {
              --matrix-col-1: 94px;
              --matrix-col-2: 96px;
              --matrix-data-col: 54px;
              min-width: 0;
              max-width: 100%;
              overflow: auto;
              overscroll-behavior: contain;
              padding: 5px;
            }
            .matrix-table {
              min-width: max-content;
              font-size: 9.5px;
            }
            .matrix-table th,
            .matrix-table td {
              height: 39px;
              padding: 3px 3px;
              line-height: 1.08;
            }
            .matrix-table th {
              font-size: 8.5px;
              hyphens: auto;
            }

            @media (max-width: 767px) {
              #app-shell {
                width: min(100% - 22px, 620px);
                padding-top: max(10px, env(safe-area-inset-top));
              }
              .brand-masthead {
                min-height: 154px;
                margin-bottom: 10px;
              }
              .brand-mark { font-size: 58px; }
              .brand-thai { font-size: 24px; margin-top: 5px; }
              .brand-english { font-size: 9px; margin-top: 7px; }
              .brand-note { font-size: 11px; margin-top: 10px; }

              .hero {
                padding: 22px 18px;
                border-radius: 24px;
              }
              .brand-title { font-size: 24px; }
              .brand-title .accent { display: block; margin-top: 3px; }
              .brand-subtitle { font-size: 12px; }
              .manager-btn { min-height: 52px; font-size: 13px; }

              #app-menus { margin-top: 24px; }
              .category-block { margin-bottom: 24px; }
              .category-title { font-size: 19px; }
              .menu-grid { grid-template-columns: 1fr; gap: 9px; }
              .menu-card {
                min-height: 76px;
                padding: 8px 10px;
                border-radius: 16px;
              }
              .menu-thumb {
                width: 54px;
                height: 54px;
                flex-basis: 54px;
                border-radius: 13px;
                font-size: 26px;
              }
              .menu-card-title { font-size: 14px; }
              .menu-card-subtitle { font-size: 10px; }

              .decor-person { background-size: 600px auto; }
              .decor-a {
                width: 162px;
                height: 220px;
                left: -76px;
                top: 72px;
              }
              .decor-b {
                width: 158px;
                height: 216px;
                left: -82px;
                bottom: 16px;
              }
              .decor-c {
                width: 162px;
                height: 238px;
                right: -78px;
                bottom: 4px;
              }

              .modal {
                align-items: flex-start;
                padding: max(6px, env(safe-area-inset-top)) max(6px, env(safe-area-inset-right)) max(6px, env(safe-area-inset-bottom)) max(6px, env(safe-area-inset-left));
              }
              .modal-card {
                max-height: calc(100vh - 12px);
                max-height: calc(100dvh - 12px);
                border-radius: 21px;
              }
              .modal-header { padding: 14px 15px; }
              .modal-subtitle { font-size: 11px; }
              .calc-panel { padding: 14px; }
              #netResultList { grid-template-columns: 1fr; }
              .replacement-wrap { margin-left: 0; padding-left: 7px; }

              .matrix-card {
                width: 100%;
                height: calc(100vh - 12px);
                height: calc(100dvh - 12px);
                max-height: calc(100vh - 12px);
                max-height: calc(100dvh - 12px);
              }
              .matrix-header {
                padding: 10px;
                gap: 8px;
              }
              .matrix-actions {
                width: 100%;
                display: grid;
                grid-template-columns: 1fr 1fr;
              }
              .matrix-actions button,
              .upload-label {
                min-height: 38px;
                padding: 0 8px;
                justify-content: center;
              }
              .matrix-close { grid-column: 1 / -1; }
              #tableContainer {
                --matrix-col-1: 80px;
                --matrix-col-2: 84px;
                --matrix-data-col: 50px;
                padding: 3px;
              }
              .matrix-table { font-size: 8.5px; }
              .matrix-table th { font-size: 7.5px; }
              .matrix-table th,
              .matrix-table td { height: 37px; padding: 2px; }
            }

            @media (min-width: 768px) and (max-width: 1023px) {
              #app-shell { width: min(100% - 44px, 860px); }
              .brand-masthead { min-height: 190px; }
              .hero { width: min(680px, 100%); }
              #app-menus { width: min(760px, 100%); }
              .menu-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }

              .decor-person { background-size: 680px auto; }
              .decor-a { width: 206px; height: 286px; left: -82px; top: 90px; }
              .decor-b { width: 202px; height: 276px; left: -88px; bottom: 24px; }
              .decor-c { width: 208px; height: 300px; right: -86px; bottom: 10px; }

              .calculator-body {
                display: flex;
                flex-direction: column;
                overflow-y: auto;
              }
              .calc-panel { overflow: visible; }
              #leftPanel { border-right: 0; border-bottom: 1px solid #eddfd3; }
              .replacement-menu { max-height: none; overflow: visible; }

              #tableContainer {
                --matrix-col-1: 92px;
                --matrix-col-2: 96px;
                --matrix-data-col: 52px;
              }
            }

            @media (min-width: 1024px) {
              #app-shell { width: min(960px, calc(100% - 56px)); }
              #app-menus { width: min(880px, 100%); }
              .menu-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
              .menu-card { min-height: 82px; }
              #tableContainer {
                --matrix-col-1: 106px;
                --matrix-col-2: 108px;
                --matrix-data-col: 58px;
              }
            }

            @media (min-width: 1024px) and (min-aspect-ratio: 4/3) {
              .brand-masthead {
                min-height: 154px;
                margin-bottom: 12px;
              }
              .brand-mark { font-size: 68px; }
              .brand-thai { font-size: 28px; }
              .brand-note { margin-top: 9px; }

              .hero {
                width: min(700px, 100%);
                padding: 24px 30px;
              }
              .hero-row { gap: 15px; }
              .brand-subtitle { margin-top: 7px; }
              #app-menus { margin-top: 22px; }

              .calculator-body {
                display: grid;
                grid-template-columns: minmax(0, 44%) minmax(0, 56%);
                overflow: hidden;
              }
              .calc-panel {
                min-height: 0;
                overflow-y: auto;
                -webkit-overflow-scrolling: touch;
              }
              #leftPanel {
                border-right: 1px solid #eddfd3;
                border-bottom: 0;
              }
              .replacement-menu {
                max-height: 260px;
                overflow-y: auto;
              }
            }

            @media (min-width: 1280px) {
              #app-shell { width: min(1020px, calc(100% - 80px)); }
              #app-menus { width: min(920px, 100%); }
              .decor-a { left: max(-42px, calc(50% - 710px)); }
              .decor-b { left: max(-46px, calc(50% - 716px)); }
              .decor-c { right: max(-44px, calc(50% - 714px)); }
            }

            @media (prefers-reduced-motion: reduce) {
              *, *::before, *::after {
                scroll-behavior: auto !important;
                transition-duration: .01ms !important;
                animation-duration: .01ms !important;
              }
            }
          '''
          html = html.replace("  </style>", css + "\n  </style>", 1)

          required_logic = [
              "selectable: qty > 0",
              "option.disabled = true",
              "function calculateNetRecipe",
              "function renderMatrixTable",
          ]
          for token in required_logic:
              if token not in html:
                  raise SystemExit(f"business/interaction logic token missing: {token}")

          path.write_text(html, encoding="utf-8")
          PY

      - name: Validate inline JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, flags=re.S)
          inline = [s for s in scripts if s.strip()]
          if not inline:
              raise SystemExit("no inline script found")
          Path("/tmp/app-inline.js").write_text(inline[-1], encoding="utf-8")
          PY
          node --check /tmp/app-inline.js

      - name: Install Playwright engines
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium webkit

      - name: Verify responsive interactions
        shell: bash
        run: |
          python -m http.server 8000 >/tmp/ner-menu-ui-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          cat >/tmp/ui-check.cjs <<'JS'
          const fs = require('fs');
          const assert = require('assert');
          const { chromium, webkit } = require(process.cwd() + '/node_modules/playwright');

          const recipe = fs.readFileSync('recipe_master.json', 'utf8');
          const targets = [
            { name: 'iPhone', width: 390, height: 844 },
            { name: 'iPad portrait', width: 820, height: 1180 },
            { name: 'iPad landscape', width: 1180, height: 820 },
            { name: 'large tablet portrait', width: 1024, height: 1366 },
            { name: 'large tablet landscape', width: 1366, height: 1024 },
          ];

          async function assertViewport(page, target, checkFullFlow) {
            await page.route('https://raw.githubusercontent.com/**', route => route.fulfill({
              status: 200,
              contentType: 'application/json; charset=utf-8',
              body: recipe,
            }));
            await page.goto('http://127.0.0.1:8000/', { waitUntil: 'domcontentloaded' });
            await page.locator('.menu-card').first().waitFor();

            const home = await page.evaluate(() => ({
              scrollWidth: document.documentElement.scrollWidth,
              innerWidth: window.innerWidth,
              decorPE: getComputedStyle(document.querySelector('#decor-layer')).pointerEvents,
              decorZ: Number(getComputedStyle(document.querySelector('#decor-layer')).zIndex),
              appZ: Number(getComputedStyle(document.querySelector('#app-shell')).zIndex),
              cardCount: document.querySelectorAll('.menu-card').length,
            }));
            assert(home.cardCount > 0, `${target.name}: no menu cards`);
            assert(home.scrollWidth <= home.innerWidth + 1, `${target.name}: page horizontal overflow ${home.scrollWidth}/${home.innerWidth}`);
            assert.strictEqual(home.decorPE, 'none', `${target.name}: decoration intercepts pointer events`);
            assert(home.decorZ < home.appZ, `${target.name}: decoration is above content`);

            await page.locator('.menu-card').first().click();
            await page.locator('#calculatorModal:not(.is-hidden)').waitFor();
            const modalFits = await page.evaluate(() => {
              const r = document.querySelector('#calculatorModal .modal-card').getBoundingClientRect();
              return r.left >= -1 && r.top >= -1 && r.right <= innerWidth + 1 && r.bottom <= innerHeight + 1;
            });
            assert(modalFits, `${target.name}: calculator modal escaped viewport`);

            const firstExclude = page.locator('.exclude-btn').first();
            if (await firstExclude.count()) {
              await firstExclude.click();
              await page.locator('.replacement-wrap').first().waitFor();
              const inlinePicker = await page.evaluate(() => {
                const row = document.querySelector('.exclude-item');
                const wrap = row?.querySelector('.replacement-wrap');
                const next = row?.nextElementSibling;
                if (!row || !wrap || !next) return true;
                const w = wrap.getBoundingClientRect();
                const n = next.getBoundingClientRect();
                return w.bottom <= n.top + 2;
              });
              assert(inlinePicker, `${target.name}: replacement picker overlaps next exclusion row`);
            }

            if (!checkFullFlow) {
              await page.locator('#closeCalculatorButton').click();
              return;
            }

            await page.locator('#closeCalculatorButton').click();
            await page.locator('#managerButton').click();
            await page.locator('#pinModal:not(.is-hidden)').waitFor();
            await page.locator('#pinInput').fill('206738');
            await page.locator('#verifyPinButton').click();
            await page.locator('#matrixModal:not(.is-hidden)').waitFor();
            await page.locator('.matrix-table').waitFor();

            const matrix = await page.evaluate(() => {
              const box = document.querySelector('#matrixModal .matrix-card').getBoundingClientRect();
              const scroller = document.querySelector('#tableContainer');
              scroller.scrollLeft = 300;
              return {
                fits: box.left >= -1 && box.top >= -1 && box.right <= innerWidth + 1 && box.bottom <= innerHeight + 1,
                overflowContained: scroller.scrollWidth > scroller.clientWidth && scroller.scrollLeft > 0,
                pageOverflow: document.documentElement.scrollWidth <= innerWidth + 1,
              };
            });
            assert(matrix.fits, `${target.name}: matrix modal escaped viewport`);
            assert(matrix.overflowContained, `${target.name}: matrix does not horizontally scroll inside its container`);
            assert(matrix.pageOverflow, `${target.name}: matrix caused page horizontal overflow`);
            await page.locator('#closeMatrixButton').click();
          }

          async function orientationReflow(browser) {
            const page = await browser.newPage({ viewport: { width: 820, height: 1180 } });
            await page.route('https://raw.githubusercontent.com/**', route => route.fulfill({
              status: 200, contentType: 'application/json; charset=utf-8', body: recipe
            }));
            await page.goto('http://127.0.0.1:8000/', { waitUntil: 'domcontentloaded' });
            await page.locator('.menu-card').first().waitFor();
            await page.locator('.menu-card').first().click();
            await page.locator('#calculatorModal:not(.is-hidden)').waitFor();

            const portraitDisplay = await page.locator('.calculator-body').evaluate(el => getComputedStyle(el).display);
            assert.strictEqual(portraitDisplay, 'flex', 'iPad portrait calculator should be single-column flow');

            await page.setViewportSize({ width: 1180, height: 820 });
            await page.waitForTimeout(150);
            const landscape = await page.evaluate(() => {
              const body = document.querySelector('.calculator-body');
              const modal = document.querySelector('#calculatorModal .modal-card').getBoundingClientRect();
              return {
                display: getComputedStyle(body).display,
                fits: modal.left >= -1 && modal.top >= -1 && modal.right <= innerWidth + 1 && modal.bottom <= innerHeight + 1,
                pageOverflow: document.documentElement.scrollWidth <= innerWidth + 1,
              };
            });
            assert.strictEqual(landscape.display, 'grid', 'iPad landscape calculator should reflow to split layout');
            assert(landscape.fits, 'iPad rotate: modal escaped viewport');
            assert(landscape.pageOverflow, 'iPad rotate: page overflow after reflow');

            await page.setViewportSize({ width: 820, height: 1180 });
            await page.waitForTimeout(150);
            const back = await page.locator('.calculator-body').evaluate(el => getComputedStyle(el).display);
            assert.strictEqual(back, 'flex', 'iPad rotate back: calculator did not reflow');
            await page.close();
          }

          async function runEngine(name, launcher, targetList) {
            const browser = await launcher.launch({ headless: true });
            try {
              for (const target of targetList) {
                const page = await browser.newPage({ viewport: { width: target.width, height: target.height } });
                await assertViewport(page, target, true);
                await page.screenshot({ path: `/tmp/${name}-${target.width}x${target.height}.png`, fullPage: false });
                await page.close();
                console.log(`PASS ${name} ${target.name} ${target.width}x${target.height}`);
              }
              await orientationReflow(browser);
              console.log(`PASS ${name} orientation reflow 820x1180 <-> 1180x820`);
            } finally {
              await browser.close();
            }
          }

          (async () => {
            await runEngine('chromium', chromium, targets);
            await runEngine('webkit', webkit, targets.slice(0, 3));
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          JS
          node /tmp/ui-check.cjs

      - name: Commit verified UI
        shell: bash
        run: |
          rm -rf node_modules package-lock.json package.json
          rm -f .github/workflows/ui-refinement.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/ui-refinement.yml
          git commit -m "Refine responsive restaurant UI to match visual target"
          git push origin HEAD:main
