name: Apply and verify responsive UI refinement
on:
  push:
    branches: [main]
    paths: [".github/workflows/ui-refinement.yml"]
permissions:
  contents: write
jobs:
  refine-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Patch presentation layer
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          marker='/* UI TARGET OVERRIDES 2026-09-23 */'
          if marker in s: raise SystemExit('override already applied')
          anchor='  <main id="app-shell">\n    <section class="hero" aria-label="NER Smart Recipe">'
          mast='''  <main id="app-shell">\n    <header class="brand-masthead" aria-label="NER แจ่วฮ้อน Smart Recipe">\n      <div class="brand-mark">NER</div>\n      <div class="brand-thai">แจ่วฮ้อน</div>\n      <div class="brand-english">SMART RECIPE</div>\n      <p class="brand-note">อร่อยได้ทุกวัน เพราะทีมนี้ดูแลอยู่ ♡</p>\n    </header>\n    <section class="hero" aria-label="NER Smart Recipe">'''
          if anchor not in s: raise SystemExit('masthead anchor not found')
          s=s.replace(anchor,mast,1)
          css=r'''
          /* UI TARGET OVERRIDES 2026-09-23 */
          :root{--cream:#fff8ef;--paper:#fffdf9;--brown:#6b4635;--brown-dark:#493128;--green:#71855c;--green-soft:#edf3e8;--rose:#c86f78;--rose-soft:#fff0f1;--text:#3b312c;--muted:#8c8077;--line:#ead8c8}
          html{background:var(--cream)}
          body{min-height:100vh;min-height:100dvh;color:var(--text);overflow-x:clip;background:radial-gradient(circle at 9% 8%,rgba(244,215,194,.42),transparent 24rem),radial-gradient(circle at 93% 18%,rgba(190,211,159,.28),transparent 25rem),linear-gradient(180deg,#fffaf3 0%,#fffdf8 50%,#fbf1e6 100%)}
          #decor-layer{z-index:4;overflow:hidden;pointer-events:none!important}
          #decor-layer:before,#decor-layer:after{content:"";position:absolute;width:clamp(140px,18vw,260px);aspect-ratio:1;border-radius:50%;pointer-events:none;background:radial-gradient(ellipse at 35% 60%,rgba(115,145,82,.17) 0 24%,transparent 25%),radial-gradient(ellipse at 60% 40%,rgba(149,171,108,.14) 0 19%,transparent 20%)}
          #decor-layer:before{top:4%;right:-6%}#decor-layer:after{bottom:1%;left:-7%}
          .decor-person{opacity:.97;filter:saturate(1.03) contrast(1.01);background-size:760px auto;-webkit-mask-image:none;mask-image:none;pointer-events:none!important}
          .decor-a{width:255px;height:340px;left:-64px;top:92px;background-position:left top}.decor-b{width:236px;height:315px;left:-68px;top:auto;bottom:30px;background-position:left bottom}.decor-c{width:248px;height:355px;right:-64px;top:auto;bottom:16px;background-position:right center}
          #app-shell{z-index:20;width:min(940px,calc(100% - 32px));padding-top:max(16px,env(safe-area-inset-top));padding-bottom:calc(88px + env(safe-area-inset-bottom))}
          .brand-masthead{width:min(620px,100%);min-height:clamp(150px,20vw,215px);margin:0 auto 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--brown)}
          .brand-mark{font-size:clamp(58px,9vw,88px);line-height:.86;font-weight:800;letter-spacing:.04em;color:#76503f}.brand-thai{margin-top:7px;font-size:clamp(24px,4vw,34px);line-height:1;font-weight:800}.brand-english{margin-top:8px;padding-left:.42em;font-size:clamp(9px,1.5vw,12px);font-weight:800;letter-spacing:.42em;color:#8d6553}.brand-note{margin:13px 0 0;color:#a36e5c;font-size:clamp(11px,1.7vw,14px);font-weight:600}
          .hero{width:min(700px,100%);margin:0 auto;padding:clamp(21px,4vw,32px);border-color:rgba(230,211,193,.9);border-radius:28px;background:rgba(255,253,250,.97);box-shadow:0 16px 40px rgba(91,59,42,.1)}
          .hero-row{flex-direction:column;align-items:stretch;gap:17px;text-align:center}.brand-title{color:var(--brown-dark);font-size:clamp(25px,4vw,34px)}.brand-title .accent{color:var(--brown-dark)}.brand-subtitle{width:min(560px,100%);margin:9px auto 0;color:#87786f;font-size:13px;line-height:1.6}
          .manager-btn{width:min(520px,100%);min-height:54px;margin:0 auto;padding:0 18px;border-radius:16px;background:linear-gradient(135deg,#704c3b,#4a3027);box-shadow:0 10px 24px rgba(73,48,38,.18);display:flex;align-items:center;justify-content:center;gap:8px}.manager-btn:after{content:"›";margin-left:auto;font-size:26px;font-weight:500}
          #app-menus{width:min(860px,100%);margin:27px auto 0}.category-block{margin-bottom:28px}.category-title{width:fit-content;margin:0 0 12px;padding:5px 2px 9px;border:0;border-bottom:2px solid #dca58d;border-radius:0;background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;font-size:20px;color:#5d3d30}.category-icon{width:31px;height:31px;background:#f1e2d3;font-size:16px}
          .menu-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.menu-card{min-width:0;min-height:84px;padding:10px 12px;gap:11px;border-radius:18px;border-color:#ebddd1;box-shadow:0 6px 18px rgba(81,57,43,.055);background:rgba(255,255,255,.96)}.menu-card>span:first-of-type{min-width:0;flex:1 1 auto}.menu-card:before{content:"🍲";width:58px;height:58px;flex:0 0 58px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,#f7dfc9,#eee7d2 55%,#dfe8cf);box-shadow:inset 0 0 0 1px rgba(156,123,103,.08);font-size:28px}.menu-card-title{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px;color:#3f312b}.menu-card-subtitle{margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10.5px;color:#9b8a7e}.menu-arrow{width:auto;height:auto;flex:0 0 auto;border-radius:0;background:transparent;color:#715345;font-size:28px}
          .modal{padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}.modal-card{width:min(980px,100%);max-height:calc(100vh - 20px);max-height:calc(100dvh - 20px);border-radius:24px}.modal-header{padding:17px 19px;flex:0 0 auto}.modal-title{font-size:clamp(20px,3vw,24px)}.close-btn{width:42px;height:42px;flex-basis:42px}
          .calculator-body{display:flex;flex-direction:column;min-height:0;overflow-y:auto;overscroll-behavior:contain}.calc-panel{overflow:visible;padding:18px}#leftPanel{border-right:0;border-bottom:1px solid #eddfd3}#rightPanel{background:#fbf5ed}.exclude-item{margin-bottom:9px}.exclude-btn{min-height:50px;padding:11px 13px;border-radius:14px}.replacement-wrap{margin:8px 0 4px;padding-left:9px;border-left-width:2px}.replacement-trigger{min-height:48px}.replacement-menu{max-height:none;overflow:visible;box-shadow:0 8px 20px rgba(73,49,38,.09)}#netResultList{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.net-card{min-height:56px;padding:11px 12px}.net-name{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}.net-qty{font-size:20px}
          .matrix-card{width:min(1280px,98vw);height:min(94vh,900px);height:min(94dvh,900px);max-height:94vh;max-height:94dvh;border-radius:20px}#tableContainer{--matrix-col-1:94px;--matrix-col-2:96px;--matrix-data-col:54px;min-width:0;max-width:100%;overflow:auto;overscroll-behavior:contain;padding:5px}.matrix-table{min-width:max-content;font-size:9.5px}.matrix-table th,.matrix-table td{height:39px;padding:3px;line-height:1.08}.matrix-table th{font-size:8.5px;hyphens:auto}
          .manager-btn:focus-visible,.menu-card:focus-visible,.exclude-btn:focus-visible,.replacement-trigger:focus-visible,.replacement-option:focus-visible,.close-btn:focus-visible,.matrix-actions button:focus-visible,.upload-label:focus-within{outline:3px solid rgba(113,133,92,.35);outline-offset:2px}
          @media(max-width:767px){#app-shell{width:min(calc(100% - 22px),620px);padding-top:max(10px,env(safe-area-inset-top))}.brand-masthead{min-height:152px;margin-bottom:9px}.brand-mark{font-size:58px}.brand-thai{font-size:24px;margin-top:5px}.brand-english{font-size:9px;margin-top:7px}.brand-note{font-size:11px;margin-top:10px}.hero{padding:21px 18px;border-radius:24px}.brand-title{font-size:24px}.brand-title .accent{display:block;margin-top:3px}.brand-subtitle{font-size:12px}.manager-btn{min-height:52px;font-size:13px}#app-menus{margin-top:23px}.category-block{margin-bottom:24px}.category-title{font-size:19px}.menu-grid{grid-template-columns:1fr;gap:9px}.menu-card{min-height:76px;padding:8px 10px;border-radius:16px}.menu-card:before{width:54px;height:54px;flex-basis:54px;border-radius:13px;font-size:26px}.menu-card-title{font-size:14px}.menu-card-subtitle{font-size:10px}.decor-person{background-size:600px auto}.decor-a{width:162px;height:220px;left:-78px;top:70px}.decor-b{width:158px;height:216px;left:-82px;bottom:14px}.decor-c{width:162px;height:238px;right:-80px;bottom:4px}.modal{align-items:flex-start;padding:max(6px,env(safe-area-inset-top)) max(6px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left))}.modal-card{max-height:calc(100vh - 12px);max-height:calc(100dvh - 12px);border-radius:21px}.modal-header{padding:14px 15px}.modal-subtitle{font-size:11px}.calc-panel{padding:14px}#netResultList{grid-template-columns:1fr}.replacement-wrap{margin-left:0;padding-left:7px}.matrix-card{width:100%;height:calc(100vh - 12px);height:calc(100dvh - 12px);max-height:calc(100vh - 12px);max-height:calc(100dvh - 12px)}.matrix-header{padding:10px;gap:8px}.matrix-actions{width:100%;display:grid;grid-template-columns:1fr 1fr}.matrix-actions button,.upload-label{min-height:38px;padding:0 8px;justify-content:center}.matrix-close{grid-column:1/-1}#tableContainer{--matrix-col-1:80px;--matrix-col-2:84px;--matrix-data-col:50px;padding:3px}.matrix-table{font-size:8.5px}.matrix-table th{font-size:7.5px}.matrix-table th,.matrix-table td{height:37px;padding:2px}}
          @media(min-width:768px) and (max-width:1023px){#app-shell{width:min(calc(100% - 44px),860px)}.brand-masthead{min-height:188px}.hero{width:min(680px,100%)}#app-menus{width:min(760px,100%)}.menu-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.decor-person{background-size:680px auto}.decor-a{width:206px;height:286px;left:-98px;top:88px}.decor-b{width:202px;height:276px;left:-102px;bottom:22px}.decor-c{width:208px;height:300px;right:-100px;bottom:8px}.calculator-body{display:flex;flex-direction:column;overflow-y:auto}.calc-panel{overflow:visible}#leftPanel{border-right:0;border-bottom:1px solid #eddfd3}.replacement-menu{max-height:none;overflow:visible}#tableContainer{--matrix-col-1:92px;--matrix-col-2:96px;--matrix-data-col:52px}}
          @media(min-width:1024px){#app-shell{width:min(960px,calc(100% - 56px))}#app-menus{width:min(880px,100%)}.menu-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.menu-card{min-height:82px}#tableContainer{--matrix-col-1:106px;--matrix-col-2:108px;--matrix-data-col:58px}}
          @media(min-width:1024px) and (min-aspect-ratio:4/3){.brand-masthead{min-height:150px;margin-bottom:11px}.brand-mark{font-size:66px}.brand-thai{font-size:27px}.brand-note{margin-top:8px}.hero{width:min(700px,100%);padding:23px 30px}.hero-row{gap:14px}#app-menus{margin-top:21px}.calculator-body{display:grid;grid-template-columns:minmax(0,44%) minmax(0,56%);overflow:hidden}.calc-panel{min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}#leftPanel{border-right:1px solid #eddfd3;border-bottom:0}.replacement-menu{max-height:260px;overflow-y:auto}}
          @media(min-width:1280px){#app-shell{width:min(1020px,calc(100% - 80px))}#app-menus{width:min(920px,100%)}.decor-a{left:max(-48px,calc(50% - 710px))}.decor-b{left:max(-52px,calc(50% - 716px))}.decor-c{right:max(-50px,calc(50% - 714px))}}
          @media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition-duration:.01ms!important;animation-duration:.01ms!important}}
          '''
          s=s.replace('  </style>',css+'\n  </style>',1)
          for token in ('selectable: qty > 0','option.disabled = true','function calculateNetRecipe','function renderMatrixTable'):
              if token not in s: raise SystemExit('logic token missing: '+token)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate and browser-test
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          inline=[x for x in re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S) if x.strip()]
          Path('/tmp/app.js').write_text(inline[-1],encoding='utf-8')
          PY
          node --check /tmp/app.js
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium webkit >/dev/null
          python -m http.server 8000 >/tmp/server.log 2>&1 &
          PID=$!; trap 'kill $PID || true' EXIT; sleep 2
          cat >/tmp/check.cjs <<'JS'
          const fs=require('fs'),assert=require('assert'),{chromium,webkit}=require(process.cwd()+'/node_modules/playwright');
          const recipe=fs.readFileSync('recipe_master.json','utf8');
          const sizes=[[390,844],[820,1180],[1180,820],[1024,1366],[1366,1024]];
          async function pageAt(browser,w,h){const p=await browser.newPage({viewport:{width:w,height:h}});await p.route('https://raw.githubusercontent.com/**',r=>r.fulfill({status:200,contentType:'application/json',body:recipe}));await p.goto('http://127.0.0.1:8000/',{waitUntil:'domcontentloaded'});await p.locator('.menu-card').first().waitFor();return p}
          async function flow(browser,w,h){const p=await pageAt(browser,w,h);let x=await p.evaluate(()=>({sw:document.documentElement.scrollWidth,iw:innerWidth,pe:getComputedStyle(document.querySelector('#decor-layer')).pointerEvents,dz:+getComputedStyle(document.querySelector('#decor-layer')).zIndex,az:+getComputedStyle(document.querySelector('#app-shell')).zIndex}));assert(x.sw<=x.iw+1,`page overflow ${w}x${h}`);assert.equal(x.pe,'none');assert(x.dz<x.az);await p.locator('.menu-card').first().click();await p.locator('#calculatorModal:not(.is-hidden)').waitFor();assert(await p.evaluate(()=>{const r=document.querySelector('#calculatorModal .modal-card').getBoundingClientRect();return r.left>=-1&&r.top>=-1&&r.right<=innerWidth+1&&r.bottom<=innerHeight+1}));const e=p.locator('.exclude-btn').first();if(await e.count()){await e.click();await p.locator('.replacement-wrap').first().waitFor();assert(await p.evaluate(()=>{const r=document.querySelector('.exclude-item'),w=r?.querySelector('.replacement-wrap'),n=r?.nextElementSibling;if(!r||!w||!n)return true;return w.getBoundingClientRect().bottom<=n.getBoundingClientRect().top+2}),'picker overlap')}await p.locator('#closeCalculatorButton').click();await p.locator('#managerButton').click();await p.locator('#pinInput').fill('206738');await p.locator('#verifyPinButton').click();await p.locator('#matrixModal:not(.is-hidden)').waitFor();await p.locator('.matrix-table').waitFor();let m=await p.evaluate(()=>{const r=document.querySelector('#matrixModal .matrix-card').getBoundingClientRect(),s=document.querySelector('#tableContainer');s.scrollLeft=300;return{fit:r.left>=-1&&r.top>=-1&&r.right<=innerWidth+1&&r.bottom<=innerHeight+1,scroll:s.scrollWidth>s.clientWidth&&s.scrollLeft>0,page:document.documentElement.scrollWidth<=innerWidth+1}});assert(m.fit);assert(m.scroll,'matrix not horizontally scrollable');assert(m.page,'matrix page overflow');await p.locator('#closeMatrixButton').click();await p.close();console.log('PASS',w+'x'+h)}
          async function rotate(browser){const p=await pageAt(browser,820,1180);await p.locator('.menu-card').first().click();assert.equal(await p.locator('.calculator-body').evaluate(e=>getComputedStyle(e).display),'flex');await p.setViewportSize({width:1180,height:820});await p.waitForTimeout(100);let a=await p.evaluate(()=>({d:getComputedStyle(document.querySelector('.calculator-body')).display,sw:document.documentElement.scrollWidth,iw:innerWidth}));assert.equal(a.d,'grid');assert(a.sw<=a.iw+1);await p.setViewportSize({width:820,height:1180});await p.waitForTimeout(100);assert.equal(await p.locator('.calculator-body').evaluate(e=>getComputedStyle(e).display),'flex');await p.close();console.log('PASS rotate')}
          async function run(){for(const [name,engine,list] of [['chromium',chromium,sizes],['webkit',webkit,sizes.slice(0,3)]]){const b=await engine.launch({headless:true});try{for(const [w,h] of list)await flow(b,w,h);await rotate(b);console.log('ENGINE PASS',name)}finally{await b.close()}}}run().catch(e=>{console.error(e);process.exit(1)})
          JS
          node /tmp/check.cjs
      - name: Commit verified UI
        run: |
          rm -rf node_modules package.json package-lock.json
          rm -f .github/workflows/ui-refinement.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/ui-refinement.yml
          git commit -m "Refine responsive restaurant UI to match visual target"
          git push origin HEAD:main
