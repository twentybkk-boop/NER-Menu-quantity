name: Extract transparent character assets and verify UI

on:
  push:
    branches: [main]
    paths: [".github/workflows/extract-character-assets.yml"]

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - name: Generate transparent character crops and update presentation
        run: |
          python -m pip install --quiet pillow numpy
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFilter
          import numpy as np

          src_path=Path('assets/ner-team-bg.webp')
          src=Image.open(src_path).convert('RGB')
          if src.size != (540,360):
              raise SystemExit(f'unexpected source asset size: {src.size}')

          a=np.asarray(src).astype(np.float32)
          bg=np.array([252.,251.,244.],dtype=np.float32)
          dist=np.linalg.norm(a-bg,axis=2)
          mx=a.max(axis=2); mn=a.min(axis=2)
          sat=mx-mn
          dark=255-a.mean(axis=2)
          signal=np.maximum.reduce([dist,sat*1.15,dark*0.92])
          alpha=np.clip((signal-13)/36*255,0,255).astype(np.uint8)
          alpha=Image.fromarray(alpha).filter(ImageFilter.GaussianBlur(.7))
          rgba=src.convert('RGBA'); rgba.putalpha(alpha)

          specs={
            'ner-character-top-left.png': (0,0,168,176),
            'ner-character-bottom-left.png': (0,185,188,360),
            'ner-character-right.png': (380,55,540,360),
          }
          for name,box in specs.items():
              out=rgba.crop(box)
              out.putalpha(out.getchannel('A').filter(ImageFilter.GaussianBlur(.35)))
              out.save(Path('assets')/name,optimize=True)

          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          marker='/* TRANSPARENT CHARACTER ASSETS 2026-09-23 */'
          if marker in s:
              raise SystemExit('transparent character override already present')
          css=r'''
          /* TRANSPARENT CHARACTER ASSETS 2026-09-23 */
          .decor-person{
            background-color:transparent!important;
            background-repeat:no-repeat!important;
            background-position:center!important;
            background-size:contain!important;
            opacity:1!important;
            pointer-events:none!important;
          }
          .decor-a{
            background-image:url('assets/ner-character-top-left.png')!important;
            width:168px!important;height:176px!important;
            left:-12px!important;right:auto!important;top:22px!important;bottom:auto!important;
          }
          .decor-b{
            background-image:url('assets/ner-character-bottom-left.png')!important;
            width:188px!important;height:175px!important;
            left:-18px!important;right:auto!important;top:690px!important;bottom:auto!important;
          }
          .decor-c{
            background-image:url('assets/ner-character-right.png')!important;
            width:160px!important;height:305px!important;
            left:auto!important;right:-10px!important;top:520px!important;bottom:auto!important;
          }
          @media(max-width:767px){
            #decor-layer{height:900px!important}
            .decor-a{width:154px!important;height:161px!important;left:-18px!important;top:20px!important}
            .decor-b{width:168px!important;height:156px!important;left:-22px!important;top:684px!important}
            .decor-c{width:154px!important;height:294px!important;right:-18px!important;top:520px!important}
          }
          @media(min-width:768px) and (max-width:1023px){
            #decor-layer{height:1180px!important}
            .decor-a{width:194px!important;height:203px!important;left:-8px!important;top:44px!important}
            .decor-b{width:205px!important;height:191px!important;left:-8px!important;top:830px!important}
            .decor-c{width:190px!important;height:362px!important;right:-6px!important;top:665px!important}
          }
          @media(min-width:1024px){
            #decor-layer{height:820px!important}
            .decor-a{width:230px!important;height:241px!important;left:12px!important;top:42px!important}
            .decor-b{width:238px!important;height:222px!important;left:12px!important;top:530px!important}
            .decor-c{width:224px!important;height:427px!important;right:12px!important;top:338px!important}
          }
          '''
          s=s.replace('</style>',css+'\n</style>',1)
          for token in ('selectable: qty > 0','option.disabled = true','function calculateNetRecipe','function renderMatrixTable'):
              if token not in s: raise SystemExit('business logic token missing: '+token)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate Chromium and WebKit
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          inline=[x for x in re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S) if x.strip()]
          Path('/tmp/app.js').write_text(inline[-1],encoding='utf-8')
          PY
          node --check /tmp/app.js
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium webkit >/dev/null
          python -m http.server 8000 >/tmp/server.log 2>&1 &
          PID=$!; trap 'kill $PID || true' EXIT; sleep 2
          cat >/tmp/check.cjs <<'JS'
          const fs=require('fs'),assert=require('assert'),{chromium,webkit}=require(process.cwd()+'/node_modules/playwright');
          const recipe=fs.readFileSync('recipe_master.json','utf8');
          const all=[['iphone',390,844],['ipadp',820,1180],['ipadl',1180,820],['ipadp2',1024,1366],['ipadl2',1366,1024]];
          async function pageAt(b,w,h){const p=await b.newPage({viewport:{width:w,height:h}});await p.route('https://raw.githubusercontent.com/**',r=>r.fulfill({status:200,contentType:'application/json',body:recipe}));await p.goto('http://127.0.0.1:8000/',{waitUntil:'domcontentloaded'});await p.locator('.menu-card').first().waitFor();return p}
          async function flow(b,name,w,h,capture){const p=await pageAt(b,w,h);const base=await p.evaluate(()=>({sw:document.documentElement.scrollWidth,iw:innerWidth,pe:getComputedStyle(document.querySelector('#decor-layer')).pointerEvents,imgs:[...document.querySelectorAll('.decor-person')].map(e=>getComputedStyle(e).backgroundImage)}));assert(base.sw<=base.iw+1);assert.equal(base.pe,'none');assert(base.imgs.every(x=>x.includes('ner-character-')),'transparent assets not active');if(capture)await p.screenshot({path:`/tmp/review/${name}-home.png`,fullPage:false});await p.locator('.menu-card').first().click();await p.locator('#calculatorModal:not(.is-hidden)').waitFor();assert(await p.evaluate(()=>{const r=document.querySelector('#calculatorModal .modal-card').getBoundingClientRect();return r.left>=-1&&r.top>=-1&&r.right<=innerWidth+1&&r.bottom<=innerHeight+1}));const ex=p.locator('.exclude-btn').first();if(await ex.count()){await ex.click();await p.locator('.replacement-wrap').first().waitFor();assert(await p.evaluate(()=>{const row=document.querySelector('.exclude-item'),wrap=row?.querySelector('.replacement-wrap'),next=row?.nextElementSibling;if(!row||!wrap||!next)return true;return wrap.getBoundingClientRect().bottom<=next.getBoundingClientRect().top+2}));}if(capture)await p.screenshot({path:`/tmp/review/${name}-calc.png`,fullPage:false});await p.locator('#closeCalculatorButton').click();await p.locator('#managerButton').click();await p.locator('#pinInput').fill('206738');await p.locator('#verifyPinButton').click();await p.locator('#matrixModal:not(.is-hidden)').waitFor();await p.locator('.matrix-table').waitFor();const m=await p.evaluate(()=>{const s=document.querySelector('#tableContainer');const overflow=s.scrollWidth>s.clientWidth;if(overflow)s.scrollLeft=300;return{page:document.documentElement.scrollWidth<=innerWidth+1,contained:s.getBoundingClientRect().right<=innerWidth+1,overflow,scrolled:s.scrollLeft>0}});assert(m.page&&m.contained);if(m.overflow)assert(m.scrolled);await p.close();console.log('PASS',name,w+'x'+h)}
          async function rotate(b){const p=await pageAt(b,820,1180);await p.locator('.menu-card').first().click();assert.equal(await p.locator('.calculator-body').evaluate(e=>getComputedStyle(e).display),'flex');await p.setViewportSize({width:1180,height:820});await p.waitForTimeout(100);assert.equal(await p.locator('.calculator-body').evaluate(e=>getComputedStyle(e).display),'grid');assert(await p.evaluate(()=>document.documentElement.scrollWidth<=innerWidth+1));await p.setViewportSize({width:820,height:1180});await p.waitForTimeout(100);assert.equal(await p.locator('.calculator-body').evaluate(e=>getComputedStyle(e).display),'flex');await p.close();console.log('PASS rotate')}
          async function run(){fs.mkdirSync('/tmp/review',{recursive:true});for(const [engineName,engine,sizes] of [['chromium',chromium,all],['webkit',webkit,all.slice(0,3)]]){const b=await engine.launch({headless:true});try{for(const [n,w,h] of sizes)await flow(b,engineName+'-'+n,w,h,engineName==='chromium');await rotate(b);console.log('ENGINE PASS',engineName)}finally{await b.close()}}}run().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/check.cjs

      - uses: actions/upload-artifact@v4
        with:
          name: transparent-character-review
          path: /tmp/review
          retention-days: 1

      - name: Commit verified character assets
        run: |
          rm -rf node_modules package.json package-lock.json
          rm -f .github/workflows/extract-character-assets.yml .github/workflows/ui-real-review-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/ner-character-*.png .github/workflows/extract-character-assets.yml .github/workflows/ui-real-review-fix.yml
          git commit -m "Extract transparent character assets for responsive UI"
          git push origin HEAD:main
