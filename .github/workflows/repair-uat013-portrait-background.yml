name: Repair exact UAT-013 portrait background

on:
  push:
    branches:
      - main
    paths:
      - repair-staging/uat013/RUN_EXACT_REPAIR

permissions:
  contents: write

concurrency:
  group: repair-uat013-portrait-background
  cancel-in-progress: false

jobs:
  repair-portrait-background:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify approved portrait background
        shell: bash
        run: |
          set -euo pipefail

          cat repair-staging/uat013/portrait-*.b64 \
            | tr -d '\n\r\t ' \
            | base64 -d \
            > /tmp/background-portrait-garden-v1.webp

          test "$(wc -c < /tmp/background-portrait-garden-v1.webp | tr -d ' ')" = "125912"
          echo "050777632f5fcd1c9217777e4925041633699f52ad37636aeb100a08226ad823  /tmp/background-portrait-garden-v1.webp" | sha256sum -c -

          cp /tmp/background-portrait-garden-v1.webp assets/background-portrait-garden-v1.webp

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/background-portrait-garden-v1.webp

          actual_paths="$(git diff --cached --name-only | sort)"
          expected_paths="assets/background-portrait-garden-v1.webp"
          test "$actual_paths" = "$expected_paths"

          git commit -m "Map exact approved UAT-013 portrait background"
          git push origin "HEAD:${GITHUB_REF_NAME}"
