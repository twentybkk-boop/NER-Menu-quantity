name: Repair exact UAT-011 overlays

on:
  push:
    branches:
      - main
    paths:
      - repair-staging/uat011/RUN_EXACT_REPAIR

permissions:
  contents: write

concurrency:
  group: repair-uat011-exact-overlays
  cancel-in-progress: false

jobs:
  repair-overlays:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Reconstruct and verify exact cleaned overlays
        shell: bash
        run: |
          set -euo pipefail

          cat repair-staging/uat011/top-*.b64 > /tmp/top.b64
          cat repair-staging/uat011/bottom-*.b64 > /tmp/bottom.b64

          base64 --decode /tmp/top.b64 > /tmp/overlay-top-left-hires.webp
          base64 --decode /tmp/bottom.b64 > /tmp/overlay-bottom-left-hires.webp

          test "$(wc -c < /tmp/overlay-top-left-hires.webp | tr -d ' ')" = "180814"
          test "$(wc -c < /tmp/overlay-bottom-left-hires.webp | tr -d ' ')" = "233136"

          echo "f0ffd24fdde830d06b0d715c7c6ba8c2e81402c9e93731524a3dfa724915d393  /tmp/overlay-top-left-hires.webp" | sha256sum -c -
          echo "bd645b4744270e221fe0eae8fe08eabf2771269391ddfc4650492e6da831ad31  /tmp/overlay-bottom-left-hires.webp" | sha256sum -c -

          cp /tmp/overlay-top-left-hires.webp assets/overlay-top-left-hires.webp
          cp /tmp/overlay-bottom-left-hires.webp assets/overlay-bottom-left-hires.webp

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/overlay-top-left-hires.webp assets/overlay-bottom-left-hires.webp

          actual_paths="$(git diff --cached --name-only | sort)"
          expected_paths="$(printf '%s\n' assets/overlay-bottom-left-hires.webp assets/overlay-top-left-hires.webp | sort)"
          test "$actual_paths" = "$expected_paths"

          git commit -m "Map exact cleaned UAT-011 overlays"
          git push origin "HEAD:${GITHUB_REF_NAME}"
