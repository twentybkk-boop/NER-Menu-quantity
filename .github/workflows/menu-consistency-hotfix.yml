name: Menu consistency hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/menu-consistency-hotfix.yml'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix names and replacement dropdown behavior
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          NAME_REPLACEMENTS = {
              'ปลากหมึก': 'ปลาหมึก',
              'เนื้อเสื้อร้องให้สไลซ์': 'เนื้อเสือร้องไห้สไลซ์',
          }

          # Keep both active and legacy JSON data on the same canonical ingredient names.
          for filename in ('recipe_master.json', 'data.json'):
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              for wrong, correct in NAME_REPLACEMENTS.items():
                  text = text.replace(wrong, correct)
              json.loads(text)
              path.write_text(text, encoding='utf-8')

          index_path = Path('index.html')
          html = index_path.read_text(encoding='utf-8')

          # Protect future Excel imports from reintroducing the old typo spellings.
          github_url_marker = '    const GITHUB_JSON_URL = "https://raw.githubusercontent.com/twentybkk-boop/NER-Menu-quantity/main/recipe_master.json";'
          alias_block = '''    // Canonical names protect the app from old/typo names in imported Excel files.
            const ingredientNameAliases = {
              "ปลากหมึก": "ปลาหมึก",
              "เนื้อเสื้อร้องให้สไลซ์": "เนื้อเสือร้องไห้สไลซ์"
            };

            const canonicalIngredientName = (item) => {
              let cleanItem = String(item || "").trim();
              return ingredientNameAliases[cleanItem] || cleanItem;
            };

          '''
          if github_url_marker not in html:
              raise SystemExit('GITHUB_JSON_URL marker not found')
          html = html.replace(github_url_marker, alias_block + github_url_marker, 1)

          # Show zero-value in-set replacements as disabled explanatory options.
          start = html.index('    function getSortedValidReplacements(menuName, excludedItem) {')
          end = html.index('    function checkAndFixFallbacks()', start)
          replacement_functions = '''    function getSortedReplacementOptions(menuName, excludedItem) {
              const menuBaseIngredients = Object.keys(originalMenu[menuName] || {});
              let rule = replaceUseRules.find(r => String(r.menu).trim() === String(menuName).trim() && String(r.exclude).trim() === String(excludedItem).trim());
              let options = [];
              if (rule && rule.replace) {
                Object.entries(rule.replace).forEach(([repItem, repQty]) => {
                  if (repItem === excludedItem) return;
                  let hasInBaseMenu = menuBaseIngredients.includes(repItem);
                  let isNotExcluded = excludedItemsMap[repItem] === undefined;
                  let qty = Number(repQty);
                  if (hasInBaseMenu && isNotExcluded && repQty !== undefined && !Number.isNaN(qty)) {
                    options.push({ name: repItem, qty: qty, selectable: qty > 0 });
                  }
                });
              }

              // Smart Default still prefers vegetables/sides when the excluded item is in that group.
              let isExcludedVeggie = veggieGroups.includes(excludedItem);
              if (isExcludedVeggie) {
                options.sort((a, b) => {
                  let aIsVeg = veggieGroups.includes(a.name);
                  let bIsVeg = veggieGroups.includes(b.name);
                  if (aIsVeg && !bIsVeg) return -1;
                  if (!aIsVeg && bIsVeg) return 1;
                  return 0;
                });
              }

              return options;
            }

            function getSortedValidReplacements(menuName, excludedItem) {
              return getSortedReplacementOptions(menuName, excludedItem)
                .filter(option => option.selectable)
                .map(option => option.name);
            }

          '''
          html = html[:start] + replacement_functions + html[end:]

          # Canonicalize names while importing both Excel sheets.
          replacements = [
              ('let ingName = String(headerRowOrig[i] || "").trim();', 'let ingName = canonicalIngredientName(headerRowOrig[i]);'),
              ('let h = String(headerRowRep[i]||"").trim();', 'let h = canonicalIngredientName(headerRowRep[i]);'),
              ('let excludeName = String(row[1] || "").trim();', 'let excludeName = canonicalIngredientName(row[1]);'),
              ('let ingName = String(headerRowRep[i] || "").trim();', 'let ingName = canonicalIngredientName(headerRowRep[i]);'),
          ]
          for old, new in replacements:
              if old not in html:
                  raise SystemExit(f'Excel import marker not found: {old}')
              html = html.replace(old, new, 1)

          # Hard guard: a zero-value option can never be accepted even if the UI is manipulated.
          start = html.index('    function setReplacement(excludedItem, replacementItem) {')
          end = html.index('    function renderExcludeOptions()', start)
          set_replacement = '''    function setReplacement(excludedItem, replacementItem) {
              let validReps = getSortedValidReplacements(currentActiveMenu, excludedItem);
              if (!validReps.includes(replacementItem)) {
                renderExcludeOptions();
                return;
              }
              excludedItemsMap[excludedItem] = replacementItem;
              renderNetResults();
            }

          '''
          html = html[:start] + set_replacement + html[end:]

          dropdown_start_marker = "        if (isExcluded) {\n          let validReps = getSortedValidReplacements(currentActiveMenu, item);"
          dropdown_end_marker = "          `;\n        }\n        html += `</div>`;"
          start = html.index(dropdown_start_marker)
          end = html.index(dropdown_end_marker, start)
          end += len("          `;\n        }")
          dropdown_block = '''        if (isExcluded) {
                  let replacementOptions = getSortedReplacementOptions(currentActiveMenu, item);
                  let selectableOptions = replacementOptions.filter(option => option.selectable);
                  let optionsHtml = '';

                  if (selectableOptions.length === 0) {
                    optionsHtml += `<option value="" selected disabled>ไม่มีรายการที่แทนได้</option>`;
                  }

                  replacementOptions.forEach(option => {
                    if (option.selectable) {
                      let selected = excludedItemsMap[item] === option.name ? 'selected' : '';
                      optionsHtml += `<option value="${option.name}" ${selected}>${option.name}</option>`;
                    } else {
                      optionsHtml += `<option value="" disabled>${option.name} - แทนไม่ได้</option>`;
                    }
                  });

                  if (replacementOptions.length === 0) {
                    optionsHtml = `<option value="" selected disabled>ไม่มีข้อมูลการแทนสำหรับรายการนี้</option>`;
                  }

                  html += `
                    <div class="mt-2 ml-4 pl-3 border-l-2 border-indigo-200">
                      <select onchange="setReplacement('${item}', this.value)" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm bg-white font-bold text-indigo-700">
                        ${optionsHtml}
                      </select>
                    </div>
                  `;
                }'''
          html = html[:start] + dropdown_block + html[end:]

          index_path.write_text(html, encoding='utf-8')
          PY

      - name: Validate data and behavior
        shell: bash
        run: |
          python -m json.tool recipe_master.json >/dev/null
          python -m json.tool data.json >/dev/null
          grep -q '"ปลาหมึก"' recipe_master.json
          ! grep -q 'ปลากหมึก' recipe_master.json
          ! grep -q 'เนื้อเสื้อร้องให้สไลซ์' recipe_master.json
          grep -q 'กุ้ง} - แทนไม่ได้\|option.name} - แทนไม่ได้' index.html
          grep -q 'selectable: qty > 0' index.html
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script>([\s\S]*?)<\/script>/g)];
          if (!scripts.length) throw new Error('inline script not found');
          new Function(scripts[scripts.length - 1][1]);
          console.log('Inline JavaScript parses successfully');
          NODE

      - name: Commit hotfix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html recipe_master.json data.json
          if git diff --cached --quiet; then
            echo "No changes required"
            exit 0
          fi
          git commit -m "Fix ingredient names and disabled zero replacements"
          git push
