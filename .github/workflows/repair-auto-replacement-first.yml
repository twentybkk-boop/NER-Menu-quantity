name: Repair first-eligible auto replacement

on:
  push:
    branches: [main]
    paths:
      - 'repair-staging/auto-replacement-first/RUN_FIX'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply guarded first-eligible patch
        run: python repair-staging/auto-replacement-first/patch_first_policy.py
      - name: Verify targeted replacement contract text
        run: |
          grep -q "function pickFirstEligibleReplacement" index.html
          ! grep -q "pickNextEligibleReplacement" index.html
          grep -q "first-eligible-middle" qa/auto-replacement-flow-contract.mjs
          grep -q "FIRST-ELIGIBLE SAME-CATEGORY AUTO PICK" CURRENT_HANDOFF.md
          git diff --check
      - name: Commit durable product and regression change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html qa/auto-replacement-flow-contract.mjs CURRENT_HANDOFF.md
          git commit -m "Choose first eligible automatic replacement"
          git push
