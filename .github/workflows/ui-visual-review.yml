name: Visual review current UI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ui-visual-review.yml"

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare asset preview
        run: |
          python - <<'PY'
          from PIL import Image
          im=Image.open('assets/ner-team-bg.webp')
          print('ASSET', im.size, im.mode)
          im.convert('RGBA').save('/tmp/ner-team-bg.png')
          PY
      - name: Capture current responsive UI
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium webkit >/dev/null
          python -m http.server 8000 >/tmp/server.log 2>&1 &
          PID=$!; trap 'kill $PID || true' EXIT; sleep 2
          cat >/tmp/capture.cjs <<'JS'
          const fs=require('fs'),{chromium}=require(process.cwd()+'/node_modules/playwright');
          const recipe=fs.readFileSync('recipe_master.json','utf8');
          async function pageAt(b,w,h){
            const p=await b.newPage({viewport:{width:w,height:h}});
            await p.route('https://raw.githubusercontent.com/**',r=>r.fulfill({status:200,contentType:'application/json',body:recipe}));
            await p.goto('http://127.0.0.1:8000/',{waitUntil:'domcontentloaded'});
            await p.locator('.menu-card').first().waitFor();
            return p;
          }
          (async()=>{
            fs.mkdirSync('/tmp/shots',{recursive:true});
            const b=await chromium.launch({headless:true});
            for(const [name,w,h] of [['iphone',390,844],['ipadp',820,1180],['ipadl',1180,820]]){
              const p=await pageAt(b,w,h);
              await p.screenshot({path:`/tmp/shots/${name}-home.png`,fullPage:true});
              await p.locator('.menu-card').first().click();
              await p.screenshot({path:`/tmp/shots/${name}-calc.png`,fullPage:false});
              const ex=p.locator('.exclude-btn').first(); if(await ex.count()){await ex.click(); await p.screenshot({path:`/tmp/shots/${name}-replace.png`,fullPage:false});}
              await p.close();
            }
            await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/capture.cjs
          cp /tmp/ner-team-bg.png /tmp/shots/
      - uses: actions/upload-artifact@v4
        with:
          name: ui-visual-review
          path: /tmp/shots
          retention-days: 1
