name: Responsive UI theme refresh

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ui-theme-refresh.yml

permissions:
  contents: write

jobs:
  refresh-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply UI refresh
        run: python .github/scripts/ui_theme_refresh.py

      - name: Validate JavaScript and custom picker
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script>([\s\S]*?)<\/script>/g)];
          if (!scripts.length) throw new Error('inline script not found');
          new Function(scripts[scripts.length - 1][1]);
          if (!html.includes('replacement-menu')) throw new Error('custom picker missing');
          if (html.includes('<select onchange="setReplacement')) throw new Error('native replacement select still present');
          if (!html.includes('team-sticker team-a')) throw new Error('team edge artwork missing');
          console.log('Validation passed');
          NODE

      - name: Commit UI refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes required"
            exit 0
          fi
          git commit -m "Polish themed UI and replace native iOS picker"
          git push
