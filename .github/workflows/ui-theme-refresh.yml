name: Responsive UI theme refresh

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ui-theme-refresh.yml'

permissions:
  contents: write

jobs:
  refresh-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply NER themed responsive UI and custom replacement picker
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          new_style = r'''  <style>
            @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
            :root {
              --ner-cream: #fffaf3;
              --ner-cream-2: #f7ecdf;
              --ner-paper: rgba(255, 253, 249, .97);
              --ner-brown: #6d4937;
              --ner-brown-dark: #493126;
              --ner-brown-soft: #9b7359;
              --ner-line: #ead9c8;
              --ner-green: #70835c;
              --ner-green-soft: #eef3e9;
              --ner-rose: #c95c64;
              --ner-rose-soft: #fff1f2;
              --ner-gold: #c99a4a;
              --ner-text: #1f2937;
              --ner-muted: #7b8493;
            }

            * { box-sizing: border-box; }
            html { background: var(--ner-cream); }
            body {
              font-family: 'Plus Jakarta Sans', sans-serif;
              background:
                radial-gradient(circle at 10% 6%, rgba(235, 205, 177, .28), transparent 25%),
                radial-gradient(circle at 91% 18%, rgba(201, 218, 176, .25), transparent 25%),
                linear-gradient(180deg, #fffaf3 0%, #fffdf9 48%, #fbf2e6 100%);
              color: var(--ner-text);
              min-height: 100vh;
              overflow-x: hidden;
            }

            .team-decor {
              position: absolute;
              inset: 0;
              pointer-events: none;
              z-index: 0;
              overflow: hidden;
            }
            .team-sticker {
              position: absolute;
              background-image: url('assets/ner-team-bg.webp');
              background-repeat: no-repeat;
              filter: saturate(.98) contrast(1.02);
              opacity: .96;
              z-index: 0;
            }
            .team-sticker::after {
              content: '';
              position: absolute;
              inset: 0;
              background: linear-gradient(90deg, transparent 60%, var(--ner-cream) 100%);
            }
            .team-a {
              width: 178px;
              height: 255px;
              left: -82px;
              top: 82px;
              background-size: 930px auto;
              background-position: left top;
              border-radius: 0 40px 40px 0;
            }
            .team-b {
              width: 170px;
              height: 250px;
              left: -86px;
              top: 760px;
              background-size: 930px auto;
              background-position: left bottom;
              border-radius: 0 40px 40px 0;
            }
            .team-b::after { background: linear-gradient(90deg, transparent 60%, var(--ner-cream) 100%); }
            .team-c {
              width: 172px;
              height: 286px;
              right: -86px;
              top: 470px;
              background-size: 930px auto;
              background-position: right center;
              border-radius: 40px 0 0 40px;
            }
            .team-c::after { background: linear-gradient(270deg, transparent 60%, var(--ner-cream) 100%); }

            body > :not(.team-decor) { position: relative; z-index: 2; }

            .app-hero {
              background: var(--ner-paper);
              border: 1px solid var(--ner-line);
              box-shadow: 0 14px 40px rgba(91, 61, 43, .09);
              backdrop-filter: blur(12px);
              -webkit-backdrop-filter: blur(12px);
            }
            .app-card {
              background: rgba(255,255,255,.97);
              border-color: #eadfd4;
              box-shadow: 0 8px 22px rgba(91, 61, 43, .055);
              backdrop-filter: blur(8px);
              -webkit-backdrop-filter: blur(8px);
            }
            .app-card:hover {
              border-color: #cfb49e;
              box-shadow: 0 12px 28px rgba(91, 61, 43, .10);
              transform: translateY(-1px);
            }
            .brand-accent { color: #5b50dc; }
            .manager-btn {
              background: linear-gradient(135deg, #654534 0%, #422e25 100%);
              box-shadow: 0 10px 22px rgba(66,46,37,.20);
            }
            .section-title {
              color: var(--ner-brown-dark);
              background: rgba(255,250,243,.90);
              backdrop-filter: blur(5px);
              -webkit-backdrop-filter: blur(5px);
              border-radius: 16px;
              padding: .65rem .85rem;
              margin-left: -.35rem;
              margin-right: -.35rem;
              border-bottom-color: #e9d7c7 !important;
            }
            .section-icon {
              width: 30px;
              height: 30px;
              display: inline-flex;
              align-items: center;
              justify-content: center;
              background: #f2e2d2;
              border-radius: 999px;
              margin-right: .5rem;
              font-size: 15px;
              vertical-align: middle;
            }
            .menu-card-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
            .menu-card-arrow {
              flex: 0 0 auto;
              width: 34px;
              height: 34px;
              display: inline-flex;
              align-items: center;
              justify-content: center;
              border-radius: 999px;
              background: #f8efe6;
              color: var(--ner-brown);
              font-size: 22px;
            }

            /* Calculator modal theme */
            #calculatorModal { background: rgba(54, 45, 40, .58); }
            #calculatorModal > div {
              background: #fffdf9;
              border-color: #ead8c8 !important;
              box-shadow: 0 28px 70px rgba(42, 30, 23, .28);
            }
            #calculatorModal > div > div:first-child {
              background: linear-gradient(180deg, #fffaf4, #fbf2e8) !important;
              border-bottom-color: #ead8c8 !important;
            }
            #calcMenuTitle { color: var(--ner-brown-dark) !important; }
            #calcMenuSubtitle { color: #8b7b70 !important; }
            #leftPanel { background: #fffdf9 !important; border-right-color: #ecded1 !important; }
            #rightPanel { background: #fbf5ed !important; }
            #leftPanel > h3 { color: var(--ner-rose) !important; }
            #rightPanel > h3 { color: var(--ner-green) !important; }
            #leftPanel > h3 > span { background: var(--ner-rose) !important; }
            #rightPanel > h3 > span { background: var(--ner-green) !important; }

            .exclude-btn {
              width: 100%;
              padding: .82rem 1rem;
              border-radius: 16px;
              border: 1.5px solid #e5d8cc;
              background: #fff;
              color: #394150;
              font-size: .92rem;
              font-weight: 700;
              text-align: left;
              display: flex;
              align-items: center;
              justify-content: space-between;
              gap: 12px;
              transition: .16s ease;
            }
            .exclude-btn:active { transform: scale(.992); }
            .exclude-btn.is-excluded {
              border-color: #e46c75;
              background: var(--ner-rose-soft);
              color: #b83c49;
              box-shadow: inset 0 0 0 1px rgba(228,108,117,.13);
            }
            .exclude-status {
              white-space: nowrap;
              font-size: .78rem;
              font-weight: 800;
            }

            .replacement-wrap {
              margin: .55rem .15rem .2rem 1.15rem;
              padding-left: .75rem;
              border-left: 3px solid #d8c3ae;
            }
            .replacement-trigger {
              width: 100%;
              min-height: 46px;
              padding: .7rem .85rem;
              border-radius: 14px;
              border: 1.5px solid #ddcbbb;
              background: #fffaf4;
              color: var(--ner-brown-dark);
              display: flex;
              align-items: center;
              justify-content: space-between;
              gap: 12px;
              font-weight: 800;
              font-size: .9rem;
              text-align: left;
            }
            .replacement-trigger .hint {
              color: #9c8777;
              font-size: .72rem;
              font-weight: 600;
              display: block;
              margin-top: 2px;
            }
            .picker-chevron { color: #9a755d; font-size: 18px; transition: transform .16s ease; }
            .replacement-trigger.is-open .picker-chevron { transform: rotate(180deg); }
            .replacement-menu {
              margin-top: .45rem;
              border: 1px solid #e1d1c3;
              background: rgba(255,255,255,.99);
              border-radius: 16px;
              overflow: hidden;
              box-shadow: 0 14px 28px rgba(73,49,38,.13);
              max-height: 300px;
              overflow-y: auto;
              -webkit-overflow-scrolling: touch;
            }
            .replacement-option {
              width: 100%;
              min-height: 48px;
              padding: .72rem .9rem;
              display: flex;
              align-items: center;
              justify-content: space-between;
              gap: 12px;
              border: 0;
              border-bottom: 1px solid #f0e5dc;
              background: #fff;
              color: #374151;
              text-align: left;
              font-size: .9rem;
              font-weight: 700;
            }
            .replacement-option:last-child { border-bottom: 0; }
            .replacement-option.selectable:active { background: #f7efe8; }
            .replacement-option.selected {
              background: #f3eee7;
              color: var(--ner-brown-dark);
            }
            .replacement-option.disabled {
              color: #aaa19a;
              background: #fbf8f5;
              cursor: not-allowed;
            }
            .replacement-option .option-note {
              flex: 0 0 auto;
              font-size: .7rem;
              font-weight: 800;
              padding: .28rem .5rem;
              border-radius: 999px;
              color: #9c6b6f;
              background: #f6e9e9;
            }
            .replacement-option .selected-mark { color: var(--ner-green); font-weight: 900; }
            .picker-empty { padding: .9rem; color: #9a8e84; font-size: .82rem; font-weight: 700; }

            .net-card {
              background: rgba(255,255,255,.97);
              border: 1px solid #e6d9ce;
              box-shadow: 0 4px 12px rgba(82,59,43,.04);
            }
            .net-card.modified {
              background: var(--ner-green-soft);
              border: 2px solid #a9b99a;
            }
            .net-card.modified .net-name, .net-card.modified .net-qty { color: #526743 !important; }

            /* PIN and Matrix surfaces */
            #pinModal { background: rgba(54,45,40,.58); }
            #pinModal > div { background: #fffdf9; border-color: #ead8c8 !important; }
            #pinModal input { background: #fffaf4 !important; border-color: #e2d1c2 !important; }
            #pinModal button:last-child { background: var(--ner-brown-dark) !important; }
            #matrixModal { background: rgba(54,45,40,.68); }
            #matrixModal > div { background: #fffdf9; }
            #matrixModal > div > div:first-child { background: var(--ner-brown-dark) !important; border-bottom-color: #806250 !important; }
            #tableContainer { background: #fbf5ed !important; }

            .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
            .custom-scrollbar::-webkit-scrollbar-track { background: #f5ece4; border-radius: 4px; }
            .custom-scrollbar::-webkit-scrollbar-thumb { background: #cdb9a8; border-radius: 4px; }

            .sticky-col-1 { position: sticky; left: 0; min-width: 150px; max-width: 150px; border-right: 1px solid #e7d8cc; }
            .sticky-col-2 { position: sticky; left: 150px; min-width: 160px; max-width: 160px; border-right: 2px solid #d8c4b2; }
            thead th { position: sticky; top: 0; z-index: 20; background-color: #f8eee6; border-bottom: 2px solid #decbb9; }
            thead .sticky-col-1, thead .sticky-col-2 { z-index: 30; background-color: #f3e7dc; }
            tbody .sticky-col-1, tbody .sticky-col-2 { z-index: 10; background-color: #fffdf9; }

            @media (max-width: 767px) {
              body { padding-left: 14px !important; padding-right: 14px !important; }
              .app-hero { border-radius: 28px; }
              .app-card { border-radius: 21px; }
              .team-a { width: 150px; height: 222px; left: -78px; top: 58px; background-size: 820px auto; }
              .team-b { width: 145px; height: 230px; left: -79px; top: 890px; background-size: 820px auto; }
              .team-c { width: 150px; height: 245px; right: -81px; top: 520px; background-size: 820px auto; }
              #calculatorModal { padding: 8px !important; }
              #calculatorModal > div { max-height: 94vh !important; border-radius: 28px !important; }
              #calculatorModal > div > div:first-child { padding: 1rem !important; }
              #leftPanel, #rightPanel { padding: 1rem !important; }
              .replacement-wrap { margin-left: .55rem; }
              .replacement-menu { max-height: 250px; }
            }

            @media (min-width: 768px) {
              .team-a { width: 230px; height: 330px; left: -98px; top: 70px; background-size: 1180px auto; }
              .team-b { width: 220px; height: 325px; left: -105px; top: 720px; background-size: 1180px auto; }
              .team-c { width: 235px; height: 370px; right: -104px; top: 420px; background-size: 1180px auto; }
            }
          </style>'''

          html, n = re.subn(r'  <style>[\s\S]*?</style>', new_style, html, count=1)
          if n != 1:
              raise SystemExit('style block replacement failed')

          decor = '''\n  <div class="team-decor" aria-hidden="true">\n    <div class="team-sticker team-a"></div>\n    <div class="team-sticker team-b"></div>\n    <div class="team-sticker team-c"></div>\n  </div>\n'''
          if 'class="team-decor"' not in html:
              html = re.sub(r'(<body[^>]*>)', r'\1' + decor, html, count=1)

          # Theme modal shell/header/close button without changing behavior.
          html = html.replace('class="bg-white rounded-3xl w-full max-w-6xl shadow-2xl flex flex-col max-h-[92vh] overflow-hidden border border-slate-100"',
                              'class="bg-white rounded-3xl w-full max-w-6xl shadow-2xl flex flex-col max-h-[92vh] overflow-hidden border border-slate-100"', 1)
          html = html.replace('class="w-12 h-12 rounded-full bg-white border-2 border-slate-200 text-slate-600 font-bold hover:bg-slate-100 transition shadow-sm text-lg"',
                              'class="w-12 h-12 rounded-full bg-white border-2 border-[#dfcdbc] text-[#6d4937] font-bold hover:bg-[#f8efe6] transition shadow-sm text-lg"', 1)

          # New themed home cards.
          new_init = r'''    function initMenus() {
              const app = document.getElementById('app-menus');
              let html = '';
              let grouped = {};
              Object.keys(originalMenu).forEach(menu => {
                let cat = menuCategories[menu] || "อื่นๆ";
                if(!grouped[cat]) grouped[cat] = [];
                grouped[cat].push(menu);
              });

              for(let cat in grouped) {
                html += `<div class="mb-8"><h2 class="section-title text-xl font-bold mb-4 border-b"><span class="section-icon">🍲</span>${cat}</h2><div class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-4">`;
                grouped[cat].forEach(menuName => {
                  let isSingle = Object.keys(originalMenu[menuName]).length === 1;
                  html += `
                    <div onclick="openCalculator('${menuName}')" class="app-card p-5 rounded-2xl border transition cursor-pointer">
                      <div class="menu-card-row">
                        <div class="min-w-0">
                          <h3 class="font-bold text-lg text-[#3f312a] leading-tight mb-1">${menuName}</h3>
                          <p class="text-xs font-semibold ${isSingle ? 'text-[#70835c]' : 'text-[#a08f82]'}">${isSingle ? 'วัตถุดิบเดี่ยว' : 'จัดการสูตรตัดออก'}</p>
                        </div>
                        <span class="menu-card-arrow">›</span>
                      </div>
                    </div>
                  `;
                });
                html += `</div></div>`;
              }
              app.innerHTML = html;
            }

'''
          html, n = re.subn(r'    function initMenus\(\) \{[\s\S]*?\n    \}\n\n(?=    function openCalculator)', new_init, html, count=1)
          if n != 1:
              raise SystemExit('initMenus replacement failed')

          # Picker state.
          if 'let openReplacementPicker = null;' not in html:
              html = html.replace('    let excludedItemsMap = {};', '    let excludedItemsMap = {};\n    let openReplacementPicker = null;', 1)

          # Reset picker when calculator opens.
          html = html.replace('      excludedItemsMap = {};\n      document.getElementById(\'calcMenuTitle\').innerText = menuName;',
                              '      excludedItemsMap = {};\n      openReplacementPicker = null;\n      document.getElementById(\'calcMenuTitle\').innerText = menuName;', 1)

          picker_functions = r'''    function closeCalculator() {
              openReplacementPicker = null;
              document.getElementById('calculatorModal').classList.add('hidden');
            }

            function toggleExclude(item) {
              if (excludedItemsMap[item] !== undefined) {
                delete excludedItemsMap[item];
                if (openReplacementPicker === item) openReplacementPicker = null;
              } else {
                let validReps = getSortedValidReplacements(currentActiveMenu, item);
                excludedItemsMap[item] = validReps.length > 0 ? validReps[0] : "";
                openReplacementPicker = item;
              }
              checkAndFixFallbacks();
              renderExcludeOptions();
              renderNetResults();
            }

            function toggleReplacementPicker(item) {
              openReplacementPicker = openReplacementPicker === item ? null : item;
              renderExcludeOptions();
            }

            function setReplacement(excludedItem, replacementItem) {
              let validReps = getSortedValidReplacements(currentActiveMenu, excludedItem);
              if (!validReps.includes(replacementItem)) return;
              excludedItemsMap[excludedItem] = replacementItem;
              openReplacementPicker = null;
              renderExcludeOptions();
              renderNetResults();
            }

            function renderExcludeOptions() {
              const container = document.getElementById('excludeOptions');
              let html = '';
              const menuBaseIngredients = Object.keys(originalMenu[currentActiveMenu] || {});

              menuBaseIngredients.forEach(item => {
                const isExcluded = excludedItemsMap[item] !== undefined;
                html += `<div class="mb-3">
                  <button onclick="toggleExclude('${item}')" class="exclude-btn ${isExcluded ? 'is-excluded' : ''}">
                    <span>${item}</span>${isExcluded ? '<span class="exclude-status">✓ ตัดออก</span>' : ''}
                  </button>
                `;

                if (isExcluded) {
                  let replacementOptions = getSortedReplacementOptions(currentActiveMenu, item);
                  let selectedValue = excludedItemsMap[item] || '';
                  let selectedLabel = selectedValue || 'ไม่มีรายการที่แทนได้';
                  let isOpen = openReplacementPicker === item;
                  let optionsHtml = '';

                  if (replacementOptions.length === 0) {
                    optionsHtml = `<div class="picker-empty">ไม่มีข้อมูลการแทนสำหรับรายการนี้</div>`;
                  } else {
                    replacementOptions.forEach(option => {
                      if (option.selectable) {
                        let selected = selectedValue === option.name;
                        optionsHtml += `
                          <button type="button" class="replacement-option selectable ${selected ? 'selected' : ''}" onclick="setReplacement('${item}', '${option.name}')">
                            <span>${option.name}</span>
                            ${selected ? '<span class="selected-mark">✓ เลือกอยู่</span>' : ''}
                          </button>`;
                      } else {
                        optionsHtml += `
                          <button type="button" class="replacement-option disabled" disabled aria-disabled="true">
                            <span>${option.name}</span>
                            <span class="option-note">แทนไม่ได้</span>
                          </button>`;
                      }
                    });
                  }

                  html += `
                    <div class="replacement-wrap">
                      <button type="button" onclick="toggleReplacementPicker('${item}')" class="replacement-trigger ${isOpen ? 'is-open' : ''}" aria-expanded="${isOpen}">
                        <span><span>${selectedLabel}</span><span class="hint">เลือกวัตถุดิบทดแทน</span></span>
                        <span class="picker-chevron">⌄</span>
                      </button>
                      ${isOpen ? `<div class="replacement-menu custom-scrollbar">${optionsHtml}</div>` : ''}
                    </div>
                  `;
                }
                html += `</div>`;
              });
              container.innerHTML = html;
            }

'''
          html, n = re.subn(r'    function closeCalculator\(\)[\s\S]*?\n    function renderNetResults\(\)', picker_functions + '    function renderNetResults()', html, count=1)
          if n != 1:
              raise SystemExit('picker functions replacement failed')

          new_results = r'''    function renderNetResults() {
              const container = document.getElementById('netResultList');
              let html = '';
              calculateNetRecipe(currentActiveMenu).forEach(res => {
                html += `
                  <div class="net-card ${res.isModified ? 'modified' : ''} flex justify-between items-center p-3 rounded-xl">
                    <span class="net-name font-bold text-xs text-[#4b3a31] leading-tight truncate mr-2">${res.name}</span>
                    <div class="flex items-baseline gap-1 shrink-0">
                      <span class="net-qty text-xl font-black text-[#2d2926]">${res.qty}</span>
                      <span class="text-[10px] font-bold text-[#8d7f74]">${res.unit}</span>
                    </div>
                  </div>
                `;
              });
              container.innerHTML = html;
            }

'''
          html, n = re.subn(r'    function renderNetResults\(\) \{[\s\S]*?\n    \}\n\n(?=    function openPinModal)', new_results, html, count=1)
          if n != 1:
              raise SystemExit('renderNetResults replacement failed')

          # Theme matrix cells while preserving data/edit behavior.
          html = html.replace("let cellStyle = isHasValue ? 'text-indigo-700 font-bold bg-indigo-50/40 cursor-pointer hover:bg-indigo-200' : 'text-slate-300';",
                              "let cellStyle = isHasValue ? 'text-[#6d4937] font-bold bg-[#fff7ef] cursor-pointer hover:bg-[#f3e3d4]' : 'text-[#c4b9b0]';", 1)

          path.write_text(html, encoding='utf-8')
          PY

      - name: Validate HTML JavaScript and custom picker
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script>([\s\S]*?)<\/script>/g)];
          if (!scripts.length) throw new Error('inline script not found');
          new Function(scripts[scripts.length - 1][1]);
          if (!html.includes('replacement-menu')) throw new Error('custom picker missing');
          if (html.includes('<select onchange="setReplacement')) throw new Error('native replacement select still present');
          if (!html.includes('team-sticker team-a')) throw new Error('team edge artwork missing');
          console.log('UI JavaScript parses and custom picker/theme markers are present');
          NODE

      - name: Commit UI refresh
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes required"
            exit 0
          fi
          git commit -m "Polish themed UI and replace native iOS picker"
          git push
