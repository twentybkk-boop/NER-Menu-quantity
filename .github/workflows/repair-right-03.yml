name: Repair right-03 exact staging

on:
  push:
    branches:
      - repair/v3-2b2-exact-blobs-20260924
    paths:
      - repair-staging/right/RUN_RIGHT03

permissions:
  contents: write

jobs:
  assemble-right-03:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Assemble and verify exact right-03
        shell: bash
        run: |
          set -euo pipefail
          cat \
            repair-staging/right/right-03a.b64 \
            repair-staging/right/right-03b.b64 \
            repair-staging/right/right-03c.b64 \
            > /tmp/right-03.b64

          bytes="$(wc -c < /tmp/right-03.b64 | tr -d ' ')"
          test "$bytes" = "18000"

          actual="$(git hash-object /tmp/right-03.b64)"
          expected="654a08614380f215c9b3c785bf6945add55b897f"
          echo "right-03 bytes=$bytes blob=$actual expected=$expected"
          test "$actual" = "$expected"

          cp /tmp/right-03.b64 repair-staging/right/right-03.b64
          test "$(git hash-object repair-staging/right/right-03.b64)" = "$expected"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repair-staging/right/right-03.b64
          if git diff --cached --quiet; then
            echo "right-03 already exact; no commit needed"
            exit 0
          fi
          git commit -m "Assemble exact right chunk 03"
          git push origin "HEAD:${GITHUB_REF_NAME}"
