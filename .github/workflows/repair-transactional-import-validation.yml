name: Repair transactional import validation

on:
  push:
    paths:
      - 'repair-staging/import-transaction/RUN_FIX'

permissions:
  contents: write

jobs:
  repair-transactional-import-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact trigger head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch transactional import validation only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          css_marker = "    .matrix-close { background: #6c584d; color: #fff; }\n"
          css_insert = """    .matrix-close { background: #6c584d; color: #fff; }
    .import-status {
      margin: 10px 12px 0; padding: 12px 14px; border-radius: 14px;
      white-space: pre-line; font-size: 12px; line-height: 1.5; font-weight: 700;
      border: 1px solid transparent;
    }
    .import-status.error { background: #fff0f2; border-color: #e5aeb5; color: #8d3642; }
    .import-status.success { background: #edf3e9; border-color: #b9c9aa; color: #4d653f; }
"""
          if text.count(css_marker) != 1:
              raise SystemExit(f'expected one matrix-close marker, found {text.count(css_marker)}')
          if '.import-status.error' in text:
              raise SystemExit('import status CSS already present')
          text = text.replace(css_marker, css_insert, 1)

          html_marker = "      <div id=\"tableContainer\"></div>"
          html_insert = """      <div id="importStatus" class="import-status is-hidden" role="status" aria-live="polite"></div>
      <div id="tableContainer"></div>"""
          if text.count(html_marker) != 1:
              raise SystemExit(f'expected one tableContainer marker, found {text.count(html_marker)}')
          if 'id="importStatus"' in text:
              raise SystemExit('import status element already present')
          text = text.replace(html_marker, html_insert, 1)

          fn_marker = "    function importExcelData(event) {\n"
          if text.count(fn_marker) != 1:
              raise SystemExit(f'expected one importExcelData marker, found {text.count(fn_marker)}')
          if 'function validateImportedRecipeData(baseMenu, replaceRules)' in text:
              raise SystemExit('transactional validator already present')

          fn_lines = [
              "    function validateImportedRecipeData(baseMenu, replaceRules) {",
              "      const mismatchedMenus = [];",
              "      const invalidExcludes = [];",
              "      const duplicateRules = [];",
              "      const noOptions = [];",
              "      const ruleMap = new Map();",
              "",
              "      (replaceRules || []).forEach((rawRule, index) => {",
              "        const menu = String(rawRule?.menu || '').trim();",
              "        const exclude = String(rawRule?.exclude || '').trim();",
              "        const key = `${menu}\\u0000${exclude}`;",
              "        if (ruleMap.has(key)) duplicateRules.push({ menu, exclude, firstIndex: ruleMap.get(key).index, duplicateIndex: index });",
              "        else ruleMap.set(key, { ...rawRule, menu, exclude, index });",
              "",
              "        if (!Object.prototype.hasOwnProperty.call(baseMenu || {}, menu)) {",
              "          mismatchedMenus.push({ menu, exclude, index });",
              "          return;",
              "        }",
              "        if (!Object.prototype.hasOwnProperty.call(baseMenu[menu] || {}, exclude)) invalidExcludes.push({ menu, exclude, index });",
              "      });",
              "",
              "      Object.entries(baseMenu || {}).forEach(([menu, recipe]) => {",
              "        const ingredients = Object.keys(recipe || {});",
              "        if (ingredients.length <= 1) return;",
              "        const ingredientSet = new Set(ingredients);",
              "        ingredients.forEach(exclude => {",
              "          const rule = ruleMap.get(`${menu}\\u0000${exclude}`);",
              "          if (!rule) {",
              "            noOptions.push({ menu, exclude, reason: 'missing-rule' });",
              "            return;",
              "          }",
              "          const visibleOptions = Object.keys(rule.replace || {}).filter(rep => rep !== exclude && ingredientSet.has(rep));",
              "          if (!visibleOptions.length) noOptions.push({ menu, exclude, reason: 'no-base-overlap' });",
              "        });",
              "      });",
              "",
              "      return { mismatchedMenus, invalidExcludes, duplicateRules, noOptions };",
              "    }",
              "",
              "    function hasImportValidationErrors(result) {",
              "      return Object.values(result || {}).some(rows => Array.isArray(rows) && rows.length > 0);",
              "    }",
              "",
              "    function formatImportValidationSummary(result) {",
              "      const labels = {",
              "        mismatchedMenus: 'เมนูใน Replace Use ไม่พบใน Original menu',",
              "        invalidExcludes: 'รายการที่หักไม่อยู่ในสูตรเมนู',",
              "        duplicateRules: 'มีแถวเมนู/รายการหักซ้ำ',",
              "        noOptions: 'ไม่มีวัตถุดิบทดแทนที่ใช้ได้'",
              "      };",
              "      const lines = ['นำเข้าไม่สำเร็จ — ตรวจพบข้อมูลไม่สอดคล้อง'];",
              "      Object.entries(labels).forEach(([key, label]) => {",
              "        const rows = result?.[key] || [];",
              "        if (!rows.length) return;",
              "        const examples = rows.slice(0, 2).map(row => `${row.menu || 'ไม่ระบุเมนู'} / ${row.exclude || 'ไม่ระบุรายการ'}`).join(', ');",
              "        lines.push(`• ${label} ${rows.length} จุด${examples ? `: ${examples}` : ''}`);",
              "      });",
              "      lines.push('แก้ไฟล์ Excel แล้วอัปโหลดใหม่ — ข้อมูลเดิมยังไม่ถูกเปลี่ยน');",
              "      return lines.join('\\n');",
              "    }",
              "",
              "    function setImportStatus(kind, message) {",
              "      const status = el('importStatus');",
              "      if (!status) return;",
              "      if (!message) {",
              "        status.textContent = '';",
              "        status.className = 'import-status is-hidden';",
              "        return;",
              "      }",
              "      status.textContent = message;",
              "      status.className = `import-status ${kind === 'success' ? 'success' : 'error'}`;",
              "    }",
              "",
          ]
          text = text.replace(fn_marker, '\n'.join(fn_lines) + fn_marker, 1)

          start_marker = "    function importExcelData(event) {"
          end_marker = "\n\n    function downloadJSON()"
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          handler = text[start:end]

          file_marker = "      if (!file) return;\n"
          if handler.count(file_marker) != 1:
              raise SystemExit('file marker missing or duplicated')
          handler = handler.replace(file_marker, file_marker + "      setImportStatus('', '');\n", 1)

          assign_block = """          originalMenu = newOriginalMenu;
          menuCategories = newMenuCategories;
          replaceUseRules = newReplaceRules;
          allIngredientsList = repIngredientsList;
          initMenus();
          renderMatrixTable();
          alert('อัปโหลดและแปลงข้อมูลสำเร็จ!');"""
          replacement_block = """          const validationResult = validateImportedRecipeData(newOriginalMenu, newReplaceRules);
          if (hasImportValidationErrors(validationResult)) {
            setImportStatus('error', formatImportValidationSummary(validationResult));
            return;
          }

          originalMenu = newOriginalMenu;
          menuCategories = newMenuCategories;
          replaceUseRules = newReplaceRules;
          allIngredientsList = repIngredientsList;
          initMenus();
          renderMatrixTable();
          setImportStatus('success', `นำเข้าสำเร็จ • ${Object.keys(newOriginalMenu).length} เมนู • ${newReplaceRules.length} กฎการแทนที่`);
          alert('อัปโหลดและแปลงข้อมูลสำเร็จ!');"""
          if handler.count(assign_block) != 1:
              raise SystemExit(f'expected one live assignment block, found {handler.count(assign_block)}')
          handler = handler.replace(assign_block, replacement_block, 1)

          catch_marker = "        } catch (err) {\n          alert('Error: ' + err.message);"
          catch_replacement = "        } catch (err) {\n          setImportStatus('error', `นำเข้าไม่สำเร็จ — ${err.message}`);\n          alert('Error: ' + err.message);"
          if handler.count(catch_marker) != 1:
              raise SystemExit('import catch marker missing or duplicated')
          handler = handler.replace(catch_marker, catch_replacement, 1)

          text = text[:start] + handler + text[end:]
          path.write_text(text, encoding='utf-8')
          PY

      - name: Run transactional import validation contract
        run: node qa/transactional-import-validation-contract.mjs

      - name: Verify minimal production diff
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          test "$changed" = "index.html"
          git diff --check
          git diff -- index.html

      - name: Commit transactional import validation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          cached="$(git diff --cached --name-only)"
          test "$cached" = "index.html"
          git commit -m "Add transactional Excel import validation"
          git push
