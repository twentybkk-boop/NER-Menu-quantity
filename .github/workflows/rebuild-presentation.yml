name: Rebuild presentation layer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-presentation.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble rebuilt UI
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .tmp/ui_rebuild2/part_00 \
            .tmp/ui_rebuild2/part_01 \
            .tmp/ui_rebuild2/part_02 \
            .tmp/ui_rebuild2/part_03 \
            .tmp/ui_rebuild2/part_04a \
            .tmp/ui_rebuild2/part_04b \
            .tmp/ui_rebuild2/part_05 \
            .tmp/ui_rebuild2/part_06 > index.html
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          assert '<main id="app-shell">' in html
          assert 'id="managerButton"' in html
          assert 'data-replacement' in html
          assert 'pointer-events: none !important' in html
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, re.S)
          inline = '\n'.join(s for s in scripts if s.strip() and 'src=' not in s[:80])
          Path('/tmp/index-inline.js').write_text(inline, encoding='utf-8')
          print('index bytes', len(html.encode('utf-8')))
          PY
          node --check /tmp/index-inline.js
          rm -rf .tmp/ui_rebuild .tmp/ui_rebuild2
          rm -f .github/workflows/rebuild-presentation.yml
      - name: Commit rebuilt presentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Rebuild responsive presentation layer"
          git push
