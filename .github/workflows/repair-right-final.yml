name: Repair exact right binary

on:
  push:
    branches:
      - repair/v3-2b2-exact-blobs-20260924
    paths:
      - repair-staging/right/RUN_RIGHT_FINAL

permissions:
  contents: write

jobs:
  assemble-right-binary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Assemble and verify exact right binary
        shell: bash
        run: |
          set -euo pipefail
          cat \
            repair-staging/right/right-00.b64 \
            repair-staging/right/right-01.b64 \
            repair-staging/right/right-02.b64 \
            repair-staging/right/right-03.b64 \
            repair-staging/right/right-04a.b64 \
            repair-staging/right/right-04b.b64 \
            repair-staging/right/right-04c.b64 \
            repair-staging/right/right-04d.b64 \
            > /tmp/right-exact.b64

          b64_bytes="$(wc -c < /tmp/right-exact.b64 | tr -d ' ')"
          test "$b64_bytes" = "68504"

          base64 --decode /tmp/right-exact.b64 > /tmp/right-q70-a60.webp
          decoded_bytes="$(wc -c < /tmp/right-q70-a60.webp | tr -d ' ')"
          test "$decoded_bytes" = "51376"

          actual_sha256="$(sha256sum /tmp/right-q70-a60.webp | awk '{print $1}')"
          expected_sha256="d94dffb06bf229f01cbed71f87133a18c8b80decabdcd32577bb7a1ff66958ed"
          echo "right binary bytes=$decoded_bytes sha256=$actual_sha256 expected_sha256=$expected_sha256"
          test "$actual_sha256" = "$expected_sha256"

          actual_blob="$(git hash-object /tmp/right-q70-a60.webp)"
          expected_blob="a4d051c52a4b0f5191ad2770c3eee416fa01aba4"
          echo "right binary blob=$actual_blob expected_blob=$expected_blob"
          test "$actual_blob" = "$expected_blob"

          cp /tmp/right-q70-a60.webp repair-staging/right/right-q70-a60.webp
          test "$(git hash-object repair-staging/right/right-q70-a60.webp)" = "$expected_blob"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repair-staging/right/right-q70-a60.webp
          if git diff --cached --quiet; then
            echo "right binary proof already exact; no commit needed"
            exit 0
          fi
          git commit -m "Assemble exact right binary proof"
          git push origin "HEAD:${GITHUB_REF_NAME}"
