name: Audit startup recipe runtime integrity

on:
  push:
    paths:
      - 'repair-staging/startup-runtime-integrity/RUN_REPRO'

permissions:
  contents: read

jobs:
  reproduce-startup-runtime-integrity-gap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run startup recipe runtime integrity contract
        run: node qa/startup-runtime-integrity-contract.mjs
