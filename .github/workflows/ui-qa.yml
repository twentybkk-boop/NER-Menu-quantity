name: UI QA

# Orientation/layering V1 keeps wide iPad landscape responsive while preserving character rails.
# Ambient round shapes are accepted only on the backmost environmental layer.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ui-qa.yml'
      - 'qa/**'
      - 'scripts/validate_thumbnail_assets.py'
      - 'docs/UI_THUMBNAIL_CONTACT_SHEET.html'
      - 'docs/UI_CHARACTER_ASSET_CONTACT_SHEET.html'
      - 'assets/**'
      - 'index.html'
      - 'recipe_master.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y
          npm install --save-dev playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Validate thumbnail contract and atlas integrity
        run: python scripts/validate_thumbnail_assets.py
      - name: Start static server
        run: |
          python3 -m http.server 8000 > /tmp/ner-ui-server.log 2>&1 &
          echo $! > /tmp/ner-ui-server.pid
          sleep 2
      - name: Run Chromium + WebKit UI QA
        run: node qa/ui-qa-runner.mjs
      - name: Verify P0-A complete character composition
        run: node qa/character-composition-v2-contract.mjs
      - name: Verify P0-B protected center frame
        run: node qa/center-frame-v2-contract.mjs
      - name: Verify P0-D top composition locally
        run: node qa/top-composition-v1-contract.mjs
      - name: Verify P0-D long-list rhythm locally
        run: node qa/long-list-rhythm-v1-contract.mjs
      - name: Verify V4 thumbnail semantics and compact density locally
        run: node qa/thumbnail-semantic-v4-contract.mjs
      - name: Verify V4 Chunk 4 character scale, detail density and safety locally
        run: node qa/chunk4-polish-v4-contract.mjs
      - name: Verify orientation layering and backmost environment locally
        run: node qa/layering-orientation-v1-contract.mjs
      - name: Verify UAT-013 portrait-native background locally
        run: node qa/uat013-portrait-background-contract.mjs
      - name: Verify V3 character high-res sharpness locally
        run: node qa/character-sampling-v1-contract.mjs
      - name: Verify calculator visual hierarchy contract
        run: node qa/calculator-visual-v2-runner.mjs
      - name: Verify multi-item shrimp pooling calculation
        run: node qa/replacement-pooling-contract.mjs
      - name: Verify V4 phone-landscape calculator interaction locally
        run: node qa/landscape-calculator-v4-contract.mjs
      - name: Verify deployed GitHub Pages P0-A/P0-B acceptance
        run: node qa/live-pages-acceptance-v2.mjs
      - name: Verify deployed GitHub Pages P0-D top composition
        env:
          TOP_COMPOSITION_BASE: https://twentybkk-boop.github.io/NER-Menu-quantity/
        run: node qa/top-composition-v1-contract.mjs
      - name: Verify deployed GitHub Pages P0-D long-list rhythm
        env:
          LONG_LIST_BASE: https://twentybkk-boop.github.io/NER-Menu-quantity/
        run: node qa/long-list-rhythm-v1-contract.mjs
      - name: Verify deployed V4 thumbnail semantics and compact density
        env:
          THUMBNAIL_V4_BASE: https://twentybkk-boop.github.io/NER-Menu-quantity/
        run: node qa/thumbnail-semantic-v4-contract.mjs
      - name: Verify deployed V4 Chunk 4 character scale, detail density and safety
        env:
          CHUNK4_BASE: https://twentybkk-boop.github.io/NER-Menu-quantity/
        run: node qa/chunk4-polish-v4-contract.mjs
      - name: Verify deployed orientation layering and backmost environment
        env:
          LAYERING_BASE: https://twentybkk-boop.github.io/NER-Menu-quantity/
        run: node qa/layering-orientation-v1-contract.mjs
      - name: Verify deployed UAT-013 portrait-native background
        env:
          UAT013_BASE: https://twentybkk-boop.github.io/NER-Menu-quantity/
        run: node qa/uat013-portrait-background-contract.mjs
      - name: Verify deployed V4 phone-landscape calculator interaction
        env:
          LANDSCAPE_BASE: https://twentybkk-boop.github.io/NER-Menu-quantity/
        run: node qa/landscape-calculator-v4-contract.mjs
      - name: Verify deployed V3 character high-res sharpness
        env:
          SHARPNESS_BASE: https://twentybkk-boop.github.io/NER-Menu-quantity/
        run: node qa/character-sampling-v1-contract.mjs
      - name: Render thumbnail contact sheet evidence
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { chromium } from 'playwright';
          const browser = await chromium.launch();
          try {
            const page = await browser.newPage({ viewport: { width: 1400, height: 1000 } });
            await page.goto('http://127.0.0.1:8000/docs/UI_THUMBNAIL_CONTACT_SHEET.html', { waitUntil: 'networkidle' });
            assert.equal(await page.locator('.card').count(), 27, 'contact sheet must contain 27 illustrated semantic regions');
            await page.screenshot({ path: 'qa-artifacts/09-thumbnail-contact-sheet.png', fullPage: true });
          } finally {
            await browser.close();
          }
          NODE
      - name: Render character asset inventory evidence
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { chromium } from 'playwright';
          const browser = await chromium.launch();
          try {
            const page = await browser.newPage({ viewport: { width: 1500, height: 1100 } });
            await page.goto('http://127.0.0.1:8000/docs/UI_CHARACTER_ASSET_CONTACT_SHEET.html', { waitUntil: 'networkidle' });
            const images = page.locator('img');
            assert.equal(await images.count(), 11, 'character asset contact sheet inventory changed unexpectedly');
            const natural = await images.evaluateAll(nodes => nodes.map(img => ({src:img.getAttribute('src'), w:img.naturalWidth, h:img.naturalHeight, complete:img.complete})));
            assert.ok(natural.every(item => item.complete && item.w > 0 && item.h > 0), `character asset failed to load: ${JSON.stringify(natural)}`);
            console.log(`character asset natural sizes: ${JSON.stringify(natural)}`);
            await page.screenshot({ path: 'qa-artifacts/10-character-asset-contact-sheet.png', fullPage: true });
          } finally {
            await browser.close();
          }
          NODE
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-qa-screenshots
          path: qa-artifacts/
          if-no-files-found: warn
