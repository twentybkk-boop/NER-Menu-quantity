name: Temporary UI QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ui-qa.yml'
      - 'qa/**'
      - 'assets/**'
      - 'index.html'
      - 'recipe_master.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ui-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Patch modal scroll preservation regression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "    function showModal(id) {\n      el(id).classList.remove('is-hidden');\n      document.body.style.overflow = 'hidden';\n    }\n    function hideModal(id) {\n      el(id).classList.add('is-hidden');\n      if (el('calculatorModal').classList.contains('is-hidden') && el('matrixModal').classList.contains('is-hidden') && el('pinModal').classList.contains('is-hidden')) {\n        document.body.style.overflow = '';\n      }\n    }\n"
          new = "    function showModal(id) {\n      el(id).classList.remove('is-hidden');\n      if (!document.body.classList.contains('modal-scroll-locked')) {\n        const scrollY = window.scrollY || document.documentElement.scrollTop || 0;\n        document.body.dataset.modalScrollY = String(scrollY);\n        document.body.classList.add('modal-scroll-locked');\n        document.body.style.position = 'fixed';\n        document.body.style.top = `-${scrollY}px`;\n        document.body.style.left = '0';\n        document.body.style.right = '0';\n        document.body.style.width = '100%';\n        document.body.style.overflow = 'hidden';\n      }\n    }\n    function hideModal(id) {\n      el(id).classList.add('is-hidden');\n      if (el('calculatorModal').classList.contains('is-hidden') && el('matrixModal').classList.contains('is-hidden') && el('pinModal').classList.contains('is-hidden')) {\n        const scrollY = Number(document.body.dataset.modalScrollY || 0);\n        document.body.style.position = '';\n        document.body.style.top = '';\n        document.body.style.left = '';\n        document.body.style.right = '';\n        document.body.style.width = '';\n        document.body.style.overflow = '';\n        document.body.classList.remove('modal-scroll-locked');\n        delete document.body.dataset.modalScrollY;\n        window.scrollTo(0, scrollY);\n      }\n    }\n"
          if new in s:
              print('scroll-lock patch already present')
          elif old in s:
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
              print('applied scroll-lock patch')
          else:
              raise SystemExit('expected showModal/hideModal block not found')
          PY
      - name: Install Playwright
        run: |
          npm init -y
          npm install --save-dev playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Validate thumbnail contract
        run: python scripts/validate_thumbnail_assets.py
      - name: Start static server
        run: |
          python3 -m http.server 8000 > /tmp/ner-ui-server.log 2>&1 &
          echo $! > /tmp/ner-ui-server.pid
          sleep 2
      - name: Run Chromium + WebKit UI QA
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('qa/ui-qa.mjs')
          s = p.read_text()
          s = s.replace("await page.waitForSelector('#calculatorModal.is-hidden');", "await page.waitForFunction(() => document.querySelector('#calculatorModal')?.classList.contains('is-hidden'));")
          s = s.replace("await page.waitForSelector('#matrixModal.is-hidden');", "await page.waitForFunction(() => document.querySelector('#matrixModal')?.classList.contains('is-hidden'));")
          s = s.replace("const cards = [...document.querySelectorAll('.menu-card')];", "const cards = [...document.querySelectorAll('.menu-card')].filter(el => Object.keys(originalMenu[el.dataset.menu] || {}).length > 1);")
          p.write_text(s)
          PY
          node qa/ui-qa.mjs
      - name: Persist verified scroll-lock fix
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Preserve page scroll across modal lifecycle [skip ci]"
            git push origin HEAD:main
          fi
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-qa-screenshots
          path: qa-artifacts/
          if-no-files-found: warn
