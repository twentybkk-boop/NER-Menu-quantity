name: Temporary UI Visual Polish QA

on:
  push:
    paths:
      - '.github/workflows/ui-visual-polish.yml'

permissions:
  contents: write

jobs:
  polish-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply presentation polish
        run: python tools/ui_visual_polish.py apply

      - name: Validate JavaScript syntax
        run: |
          python tools/ui_visual_polish.py extract-js /tmp/ner-menu-app.js
          node --check /tmp/ner-menu-app.js

      - name: Install Playwright browsers
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium webkit

      - name: Start local site
        run: |
          python -m http.server 8000 > /tmp/ner-menu-http.log 2>&1 &
          echo $! > /tmp/ner-menu-http.pid
          sleep 2

      - name: Responsive functional QA
        run: python tools/ui_visual_polish.py qa

      - name: Upload screenshots and QA result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-visual-polish-screenshots
          path: artifacts/ui-visual-qa
          if-no-files-found: warn
          retention-days: 7

      - name: Commit verified presentation changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/menu-art assets/accessory-glasses.svg assets/accessory-white-backpack.svg assets/accessory-gray-fullface-helmet.svg
          git diff --cached --quiet && exit 0
          git commit -m "Polish fixed characters and illustrated menu art"
          git push origin HEAD:main
