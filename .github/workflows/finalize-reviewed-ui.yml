name: Finalize reviewed responsive UI

on:
  push:
    branches: [main]
    paths: [".github/workflows/finalize-reviewed-ui.yml"]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - name: Apply final reviewed presentation
        run: |
          python -m pip install --quiet pillow numpy
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import numpy as np

          # Make the production-derived character crops genuinely transparent
          # instead of leaving a pale rectangular plate around them.
          for name in ('ner-character-top-left.png','ner-character-bottom-left.png','ner-character-right.png'):
              path=Path('assets')/name
              im=Image.open(path).convert('RGBA')
              a=np.asarray(im).astype(np.float32)
              rgb=a[:,:,:3]
              old=a[:,:,3]/255.0
              mean=rgb.mean(axis=2)
              sat=rgb.max(axis=2)-rgb.min(axis=2)
              signal=np.maximum((255.0-mean)*0.90, sat*1.20)
              keep=np.clip((signal-18.0)/42.0,0.0,1.0)
              a[:,:,3]=np.clip(old*keep*255.0,0,255)
              Image.fromarray(a.astype(np.uint8),'RGBA').save(path,optimize=True)

          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          marker='/* REVIEWED FINAL COMPOSITION 2026-09-23 */'
          if marker in s: raise SystemExit('reviewed final composition already present')
          s=s.replace('❌ สิ่งที่ลูกค้า “ไม่รับ” (เลือกได้หลายอัน)','สิ่งที่ลูกค้าไม่รับ',1)
          s=s.replace('⚖️ ปริมาณสุทธิ (เตรียมจัดเสิร์ฟ)','ปริมาณสุทธิ',1)

          css=r'''
          /* REVIEWED FINAL COMPOSITION 2026-09-23 */
          body{isolation:isolate}
          #decor-layer{pointer-events:none!important}
          .decor-person{
            pointer-events:none!important;
            opacity:1!important;
            background-repeat:no-repeat!important;
            background-position:center!important;
            background-size:contain!important;
          }
          .hero,.menu-card{background:#fffdf9!important}
          .panel-title{min-height:24px;margin-bottom:13px!important;font-size:15px!important;line-height:1.35!important;white-space:normal}
          .panel-title .dot{width:8px;height:8px}

          @media(max-width:767px){
            #decor-layer{height:1100px!important}
            #app-shell{width:100%!important;padding-left:0!important;padding-right:0!important;padding-top:max(8px,env(safe-area-inset-top))!important}
            .brand-masthead{box-sizing:border-box!important;width:100%!important;min-height:188px!important;margin:0 auto 5px!important;padding:0 42px 0 88px!important}
            .brand-mark{font-size:59px!important}.brand-thai{font-size:23px!important;margin-top:5px!important}.brand-english{font-size:8.5px!important;margin-top:7px!important}.brand-note{font-size:9.5px!important;line-height:1.3!important;margin-top:9px!important;white-space:nowrap!important}
            .hero{box-sizing:border-box!important;width:min(330px,calc(100% - 48px))!important;padding:17px 16px!important;border-radius:24px!important}.hero-row{gap:12px!important}.brand-title{font-size:18px!important;line-height:1.2!important;white-space:nowrap!important}.brand-title .accent{display:inline!important;margin:0!important}.brand-subtitle{font-size:10.5px!important;line-height:1.4!important;margin-top:6px!important}.manager-btn{min-height:47px!important;padding:0 13px!important;border-radius:15px!important;font-size:12px!important}
            #app-menus{box-sizing:border-box!important;width:min(306px,calc(100% - 76px))!important;margin:18px auto 0!important}.category-block{margin-bottom:22px!important}.category-title{margin-bottom:9px!important;padding:3px 0 7px!important;font-size:18px!important}.category-icon{width:27px!important;height:27px!important;font-size:14px!important}.menu-grid{grid-template-columns:1fr!important;gap:7px!important}.menu-card{box-sizing:border-box!important;min-height:60px!important;padding:6px 8px!important;gap:9px!important;border-radius:15px!important}.menu-card:before{width:47px!important;height:47px!important;flex:0 0 47px!important;border-radius:12px!important;font-size:23px!important}.menu-card-title{font-size:12.5px!important;line-height:1.2!important}.menu-card-subtitle{display:none!important}.menu-arrow{font-size:24px!important}
            .decor-a{width:185px!important;height:194px!important;left:-18px!important;right:auto!important;top:34px!important;bottom:auto!important}.decor-b{width:184px!important;height:171px!important;left:-30px!important;right:auto!important;top:812px!important;bottom:auto!important}.decor-c{width:174px!important;height:332px!important;left:auto!important;right:-38px!important;top:696px!important;bottom:auto!important}
            .calculator-body{display:flex!important;flex-direction:column!important;min-height:0!important;overflow-y:auto!important;overflow-x:hidden!important}.calc-panel{flex:0 0 auto!important;min-height:auto!important;height:auto!important;overflow:visible!important;position:relative!important;width:100%!important;padding-top:14px!important}#leftPanel{z-index:2!important;border-right:0!important;border-bottom:1px solid #eddfd3!important}#rightPanel{z-index:1!important;flex:0 0 auto!important}.replacement-wrap{position:relative!important;margin:7px 0 3px!important;padding-left:7px!important}.replacement-menu{position:static!important;max-height:none!important;overflow:visible!important;margin-top:6px!important}.replacement-option{min-height:43px!important}#netResultList{grid-template-columns:1fr!important;gap:7px!important}.panel-title{font-size:14px!important;margin-bottom:12px!important}
            #tableContainer{--matrix-col-1:72px!important;--matrix-col-2:76px!important;--matrix-data-col:48px!important;padding:2px!important}.matrix-table{font-size:8.25px!important}.matrix-table th{font-size:7.25px!important}
          }

          @media(min-width:768px) and (max-width:1023px){
            .decor-a{width:210px!important;height:220px!important;left:-12px!important;top:38px!important}.decor-b{width:218px!important;height:203px!important;left:-10px!important;top:850px!important}.decor-c{width:202px!important;height:385px!important;right:-8px!important;top:675px!important}
            .calculator-body{display:flex!important;flex-direction:column!important;min-height:0!important;overflow-y:auto!important;overflow-x:hidden!important}.calc-panel{flex:0 0 auto!important;min-height:auto!important;height:auto!important;overflow:visible!important;position:relative!important;width:100%!important}#leftPanel{z-index:2!important;border-right:0!important;border-bottom:1px solid #eddfd3!important}#rightPanel{z-index:1!important;flex:0 0 auto!important}.replacement-menu{position:static!important;max-height:none!important;overflow:visible!important}
          }

          @media(min-width:1024px){
            .decor-a{width:246px!important;height:258px!important;left:8px!important;top:34px!important}.decor-b{width:246px!important;height:229px!important;left:8px!important;top:535px!important}.decor-c{width:236px!important;height:450px!important;right:8px!important;top:330px!important}
          }
          @media(min-width:1024px) and (min-aspect-ratio:4/3){
            .calculator-body{display:grid!important;grid-template-columns:minmax(0,44%) minmax(0,56%)!important;min-height:0!important;overflow:hidden!important}.calc-panel{min-height:0!important;height:auto!important;overflow-y:auto!important;overflow-x:hidden!important;position:relative!important;width:auto!important}#leftPanel{z-index:1!important;border-right:1px solid #eddfd3!important;border-bottom:0!important}#rightPanel{z-index:1!important}.replacement-menu{position:static!important;max-height:230px!important;overflow-y:auto!important}
          }
          '''
          s=s.replace('</style>',css+'\n</style>',1)
          for t in ('selectable: qty > 0','option.disabled = true','function calculateNetRecipe','function renderMatrixTable'):
              if t not in s: raise SystemExit('business logic token missing: '+t)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Browser verification and visual captures
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          inline=[x for x in re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S) if x.strip()]
          Path('/tmp/app.js').write_text(inline[-1],encoding='utf-8')
          PY
          node --check /tmp/app.js
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium webkit >/dev/null
          python -m http.server 8000 >/tmp/server.log 2>&1 &
          PID=$!; trap 'kill $PID || true' EXIT; sleep 2
          cat >/tmp/check.cjs <<'JS'
          const fs=require('fs'),assert=require('assert'),{chromium,webkit}=require(process.cwd()+'/node_modules/playwright');
          const recipe=fs.readFileSync('recipe_master.json','utf8');const sizes=[['iphone',390,844],['ipadp',820,1180],['ipadl',1180,820],['ipadp2',1024,1366],['ipadl2',1366,1024]];
          async function pageAt(b,w,h){const p=await b.newPage({viewport:{width:w,height:h}});await p.route('https://raw.githubusercontent.com/**',r=>r.fulfill({status:200,contentType:'application/json',body:recipe}));await p.goto('http://127.0.0.1:8000/',{waitUntil:'domcontentloaded'});await p.locator('.menu-card').first().waitFor();return p}
          async function flow(b,ename,n,w,h,capture){const p=await pageAt(b,w,h);const x=await p.evaluate(()=>({sw:document.documentElement.scrollWidth,iw:innerWidth,pe:getComputedStyle(document.querySelector('#decor-layer')).pointerEvents,hero:document.querySelector('.hero').getBoundingClientRect().width,menus:document.querySelector('#app-menus').getBoundingClientRect().width,imgs:[...document.querySelectorAll('.decor-person')].map(e=>getComputedStyle(e).backgroundImage)}));assert(x.sw<=x.iw+1);assert.equal(x.pe,'none');assert(x.imgs.every(v=>v.includes('ner-character-')));if(w<768){assert(x.hero<=332);assert(x.menus<=308)}if(capture)await p.screenshot({path:`/tmp/final-review/${n}-home.png`,fullPage:false});await p.locator('.menu-card').first().click();await p.locator('#calculatorModal:not(.is-hidden)').waitFor();assert(await p.evaluate(()=>{const r=document.querySelector('#calculatorModal .modal-card').getBoundingClientRect();return r.left>=-1&&r.top>=-1&&r.right<=innerWidth+1&&r.bottom<=innerHeight+1}));const q=await p.evaluate(()=>{const t=document.querySelector('#leftPanel .panel-title').getBoundingClientRect(),f=document.querySelector('.exclude-item').getBoundingClientRect();return{tb:t.bottom,ft:f.top}});assert(q.tb<=q.ft+1,'heading overlaps first item');if(w<1024){const lr=await p.evaluate(()=>{const l=document.querySelector('#leftPanel').getBoundingClientRect(),r=document.querySelector('#rightPanel').getBoundingClientRect();return{lb:l.bottom,rt:r.top,d:getComputedStyle(document.querySelector('.calculator-body')).display}});assert.equal(lr.d,'flex');assert(lr.rt>=lr.lb-2)}const e=p.locator('.exclude-btn').first();if(await e.count()){await e.click();await p.locator('.replacement-wrap').first().waitFor();assert(await p.evaluate(()=>{const r=document.querySelector('.exclude-item'),w=r?.querySelector('.replacement-wrap'),n=r?.nextElementSibling;return !r||!w||!n||w.getBoundingClientRect().bottom<=n.getBoundingClientRect().top+2}));const d=p.locator('.replacement-option.disabled');if(await d.count())assert(await d.first().isDisabled())}if(capture)await p.screenshot({path:`/tmp/final-review/${n}-calc.png`,fullPage:false});await p.locator('#closeCalculatorButton').click();await p.locator('#managerButton').click();await p.locator('#pinModal:not(.is-hidden)').waitFor();await p.locator('#cancelPinButton').click();await p.evaluate(()=>openMatrix());await p.locator('#matrixModal:not(.is-hidden) .matrix-table').waitFor();const m=await p.evaluate(()=>{const r=document.querySelector('#matrixModal .matrix-card').getBoundingClientRect(),s=document.querySelector('#tableContainer');const o=s.scrollWidth>s.clientWidth;if(o)s.scrollLeft=300;return{fit:r.left>=-1&&r.top>=-1&&r.right<=innerWidth+1&&r.bottom<=innerHeight+1,page:document.documentElement.scrollWidth<=innerWidth+1,o,sl:s.scrollLeft}});assert(m.fit&&m.page);if(m.o)assert(m.sl>0);await p.close();console.log('PASS',ename,w+'x'+h)}
          async function rotate(b){const p=await pageAt(b,820,1180);await p.locator('.menu-card').first().click();assert.equal(await p.locator('.calculator-body').evaluate(e=>getComputedStyle(e).display),'flex');await p.setViewportSize({width:1180,height:820});await p.waitForTimeout(120);assert.equal(await p.locator('.calculator-body').evaluate(e=>getComputedStyle(e).display),'grid');assert(await p.evaluate(()=>document.documentElement.scrollWidth<=innerWidth+1));await p.setViewportSize({width:820,height:1180});await p.waitForTimeout(120);assert.equal(await p.locator('.calculator-body').evaluate(e=>getComputedStyle(e).display),'flex');await p.close();console.log('PASS rotate')}
          async function run(){fs.mkdirSync('/tmp/final-review',{recursive:true});for(const [ename,engine,list] of [['chromium',chromium,sizes],['webkit',webkit,sizes.slice(0,3)]]){const b=await engine.launch({headless:true});try{for(const [n,w,h] of list)await flow(b,ename,n,w,h,ename==='chromium');await rotate(b);console.log('ENGINE PASS',ename)}finally{await b.close()}}}run().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/check.cjs

      - uses: actions/upload-artifact@v4
        with:
          name: finalized-ui-review
          path: /tmp/final-review
          retention-days: 1

      - name: Commit and clean temporary workflows
        run: |
          rm -rf node_modules package.json package-lock.json
          rm -f .github/workflows/finalize-reviewed-ui.yml
          rm -f .github/workflows/final-real-device-polish.yml
          rm -f .github/workflows/final-ui-review-fix.yml
          rm -f .github/workflows/final-ui-review-fix-2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize mockup-matched responsive UI"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
