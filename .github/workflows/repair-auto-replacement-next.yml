name: Repair next-order auto replacement

on:
  push:
    branches: [main]
    paths:
      - 'repair-staging/auto-replacement-next/RUN_FIX'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Apply guarded next-order patch
        run: |
          python3 repair-staging/auto-replacement-next/patch_next_policy.py
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "CURRENT_HANDOFF.md index.html qa/auto-replacement-flow-contract.mjs "

      - name: Verify next-order invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          i = Path('index.html').read_text(encoding='utf-8')
          q = Path('qa/auto-replacement-flow-contract.mjs').read_text(encoding='utf-8')
          h = Path('CURRENT_HANDOFF.md').read_text(encoding='utf-8')
          assert 'function pickNextEligibleReplacement(menuName, excludedItem, items)' in i
          assert 'pickRandomReplacement' not in i
          assert 'excludedItemsMap[ex] = pickNextEligibleReplacement(currentActiveMenu, ex, autoPool);' in i
          assert 'Math.random = ' not in q
          assert 'middle exclusion must choose the next eligible meat' in q
          assert 'last meat exclusion must wrap to the first eligible meat' in q
          assert '## NEW HANDS-ON FEEDBACK — DETERMINISTIC NEXT-ORDER AUTO PICK' in h
          PY

      - name: Commit permanent next-order policy
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html qa/auto-replacement-flow-contract.mjs CURRENT_HANDOFF.md
          git commit -m 'Make automatic replacement choose next eligible item'
          git push origin HEAD:main
