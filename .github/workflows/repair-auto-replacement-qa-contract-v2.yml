name: Repair auto replacement state coverage

on:
  push:
    branches: [main]
    paths:
      - 'repair-staging/auto-replacement/RUN_QA_FIX_V2'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Patch reopen persistence and regression coverage
        run: |
          python3 repair-staging/auto-replacement/patch_state_coverage.py
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "CURRENT_HANDOFF.md index.html qa/auto-replacement-flow-contract.mjs "

      - name: Verify scoped invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          q = Path('qa/auto-replacement-flow-contract.mjs').read_text(encoding='utf-8')
          assert 'const preserveSelectionState = currentActiveMenu === menuName;' in s
          assert "if (!preserveSelectionState) {" in s
          assert 'replacement quantities did not aggregate correctly into the sole survivor' in q
          assert 'exclusion/auto-replacement state changed after close/reopen' in q
          assert 'replacement picker reopened without explicit user action' in q
          PY

      - name: Commit product and permanent regression fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html qa/auto-replacement-flow-contract.mjs CURRENT_HANDOFF.md
          git commit -m 'Preserve automatic replacement state across reopen'
          git push origin HEAD:main
