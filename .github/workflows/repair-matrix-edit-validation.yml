name: Repair Matrix numeric edit validation

on:
  push:
    paths:
      - 'repair-staging/matrix-edit/RUN_FIX'

permissions:
  contents: write

jobs:
  repair-matrix-edit-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact trigger head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Matrix numeric edit validation only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old_lines = [
              '    function editMatrixCell(rowIndex, ingredient, currentValue) {',
              '      const row = replaceUseRules[rowIndex];',
              '      if (!row) return;',
              '      const newVal = prompt(`แก้ไขปริมาณแทนที่:\\nเมนู: ${row.menu}\\nหัก: ${row.exclude}\\nแทนด้วย: ${ingredient}\\n\\nกรอกตัวเลขใหม่:`, currentValue);',
              '      if (newVal !== null && !Number.isNaN(parseFloat(newVal))) {',
              '        row.replace[ingredient] = parseFloat(newVal);',
              '        renderMatrixTable();',
              '      }',
              '    }',
          ]
          new_lines = [
              '    function editMatrixCell(rowIndex, ingredient, currentValue) {',
              '      const row = replaceUseRules[rowIndex];',
              '      if (!row) return;',
              '      const newVal = prompt(`แก้ไขปริมาณแทนที่:\\nเมนู: ${row.menu}\\nหัก: ${row.exclude}\\nแทนด้วย: ${ingredient}\\n\\nกรอกตัวเลขใหม่:`, currentValue);',
              '      if (newVal === null) return;',
              '      const normalized = String(newVal).trim();',
              "      if (!/^(?:\\d+(?:\\.\\d*)?|\\.\\d+)$/.test(normalized)) return;",
              '      const numericValue = Number(normalized);',
              '      if (!Number.isFinite(numericValue) || numericValue < 0) return;',
              '      row.replace[ingredient] = numericValue;',
              '      renderMatrixTable();',
              '    }',
          ]
          old = '\n'.join(old_lines)
          new = '\n'.join(new_lines)
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one editMatrixCell block, found {count}')
          if 'const normalized = String(newVal).trim();' in text:
              raise SystemExit('Matrix numeric validation already present; refusing duplicate patch')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Run Matrix numeric edit validation contract
        run: node qa/matrix-edit-validation-contract.mjs

      - name: Verify minimal production diff
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          test "$changed" = "index.html"
          git diff --check
          git diff -- index.html

      - name: Commit Matrix numeric edit validation fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          cached="$(git diff --cached --name-only)"
          test "$cached" = "index.html"
          git commit -m "Validate Matrix numeric edits strictly"
          git push
