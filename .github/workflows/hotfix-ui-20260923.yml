name: Hotfix UI 2026-09-23

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hotfix-ui-20260923.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply UI hotfix
        run: |
          set -euo pipefail
          python .github/scripts/hotfix_ui_20260923.py
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          assert "excludeButton.addEventListener('click'" in html
          assert "el('excludeOptions').addEventListener" not in html
          assert '--matrix-data-col: 54px' in html
          assert 'left: -34px; top: 500px' in html
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, re.S)
          inline = '\n'.join(s for s in scripts if s.strip())
          Path('/tmp/index-inline.js').write_text(inline, encoding='utf-8')
          PY
          node --check /tmp/index-inline.js

      - name: Commit hotfix and clean one-off files
        run: |
          set -euo pipefail
          rm -f .github/scripts/hotfix_ui_20260923.py
          rm -f .github/workflows/hotfix-ui-20260923.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix mobile exclusions, art visibility, and matrix density"
          git push
