name: Apply final fixes from real-device UI review

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/final-ui-review-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply presentation-only fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* FINAL REAL DEVICE FIX 2026-09-23 */'
          if marker in s:
              raise SystemExit('final real-device fix already present')

          css = r'''
          /* FINAL REAL DEVICE FIX 2026-09-23 */
          body { isolation: isolate; }
          #decor-layer { pointer-events: none !important; }
          .decor-person {
            pointer-events: none !important;
            opacity: 1 !important;
            mix-blend-mode: multiply !important;
          }
          .hero, .menu-card { background: #fffdf9 !important; }

          @media (max-width: 767px) {
            #decor-layer { height: 1020px !important; }
            #app-shell {
              width: 100% !important;
              padding-left: 0 !important;
              padding-right: 0 !important;
              padding-top: max(8px, env(safe-area-inset-top)) !important;
            }
            .brand-masthead {
              width: 100% !important;
              min-height: 188px !important;
              margin: 0 auto 5px !important;
              padding: 0 42px 0 88px !important;
            }
            .brand-mark { font-size: 59px !important; }
            .brand-thai { font-size: 23px !important; margin-top: 5px !important; }
            .brand-english { font-size: 8.5px !important; margin-top: 7px !important; }
            .brand-note {
              font-size: 9.5px !important;
              line-height: 1.3 !important;
              margin-top: 9px !important;
              white-space: nowrap !important;
            }
            .hero {
              width: min(330px, calc(100% - 48px)) !important;
              padding: 17px 16px !important;
              border-radius: 24px !important;
            }
            .hero-row { gap: 12px !important; }
            .brand-title {
              font-size: 18px !important;
              line-height: 1.2 !important;
              white-space: nowrap !important;
            }
            .brand-title .accent { display: inline !important; margin: 0 !important; }
            .brand-subtitle {
              font-size: 10.5px !important;
              line-height: 1.4 !important;
              margin-top: 6px !important;
            }
            .manager-btn {
              min-height: 47px !important;
              padding: 0 13px !important;
              border-radius: 15px !important;
              font-size: 12px !important;
            }
            #app-menus {
              width: min(306px, calc(100% - 76px)) !important;
              margin: 18px auto 0 !important;
            }
            .category-block { margin-bottom: 22px !important; }
            .category-title {
              margin-bottom: 9px !important;
              padding: 3px 0 7px !important;
              font-size: 18px !important;
            }
            .category-icon {
              width: 27px !important;
              height: 27px !important;
              font-size: 14px !important;
            }
            .menu-grid { grid-template-columns: 1fr !important; gap: 7px !important; }
            .menu-card {
              min-height: 60px !important;
              padding: 6px 8px !important;
              gap: 9px !important;
              border-radius: 15px !important;
            }
            .menu-card:before {
              width: 47px !important;
              height: 47px !important;
              flex: 0 0 47px !important;
              border-radius: 12px !important;
              font-size: 23px !important;
            }
            .menu-card-title { font-size: 12.5px !important; line-height: 1.2 !important; }
            .menu-card-subtitle { display: none !important; }
            .menu-arrow { font-size: 24px !important; }

            .decor-a {
              width: 178px !important;
              height: 186px !important;
              left: -14px !important;
              right: auto !important;
              top: 38px !important;
              bottom: auto !important;
            }
            .decor-b {
              width: 182px !important;
              height: 169px !important;
              left: -28px !important;
              right: auto !important;
              top: 724px !important;
              bottom: auto !important;
            }
            .decor-c {
              width: 170px !important;
              height: 324px !important;
              left: auto !important;
              right: -42px !important;
              top: 650px !important;
              bottom: auto !important;
            }

            .calculator-body {
              display: flex !important;
              flex-direction: column !important;
              min-height: 0 !important;
              overflow-y: auto !important;
              overflow-x: hidden !important;
            }
            .calc-panel {
              flex: 0 0 auto !important;
              min-height: auto !important;
              height: auto !important;
              overflow: visible !important;
              position: relative !important;
              width: 100% !important;
            }
            #leftPanel {
              z-index: 2 !important;
              border-right: 0 !important;
              border-bottom: 1px solid #eddfd3 !important;
            }
            #rightPanel { z-index: 1 !important; flex: 0 0 auto !important; }
            .replacement-wrap {
              position: relative !important;
              margin: 7px 0 3px !important;
              padding-left: 7px !important;
            }
            .replacement-menu {
              position: static !important;
              max-height: none !important;
              overflow: visible !important;
              margin-top: 6px !important;
            }
            .replacement-option { min-height: 43px !important; }
            #netResultList { grid-template-columns: 1fr !important; gap: 7px !important; }
            #tableContainer {
              --matrix-col-1: 76px !important;
              --matrix-col-2: 80px !important;
              --matrix-data-col: 48px !important;
            }
          }

          @media (min-width: 768px) and (max-width: 1023px) {
            .calculator-body {
              display: flex !important;
              flex-direction: column !important;
              min-height: 0 !important;
              overflow-y: auto !important;
              overflow-x: hidden !important;
            }
            .calc-panel {
              flex: 0 0 auto !important;
              min-height: auto !important;
              height: auto !important;
              overflow: visible !important;
              position: relative !important;
              width: 100% !important;
            }
            #leftPanel {
              z-index: 2 !important;
              border-right: 0 !important;
              border-bottom: 1px solid #eddfd3 !important;
            }
            #rightPanel { z-index: 1 !important; flex: 0 0 auto !important; }
            .replacement-menu {
              position: static !important;
              max-height: none !important;
              overflow: visible !important;
            }
          }

          @media (min-width: 1024px) and (min-aspect-ratio: 4/3) {
            .calculator-body {
              display: grid !important;
              grid-template-columns: minmax(0, 44%) minmax(0, 56%) !important;
              min-height: 0 !important;
              overflow: hidden !important;
            }
            .calc-panel {
              min-height: 0 !important;
              height: auto !important;
              overflow-y: auto !important;
              overflow-x: hidden !important;
              position: relative !important;
              width: auto !important;
            }
            #leftPanel {
              z-index: 1 !important;
              border-right: 1px solid #eddfd3 !important;
              border-bottom: 0 !important;
            }
            #rightPanel { z-index: 1 !important; }
            .replacement-menu {
              position: static !important;
              max-height: 230px !important;
              overflow-y: auto !important;
            }
          }
          '''

          s = s.replace('  </style>', css + '\n  </style>', 1)
          for token in ('selectable: qty > 0', 'option.disabled = true', 'function calculateNetRecipe', 'function renderMatrixTable'):
              if token not in s:
                  raise SystemExit('business/interaction logic token missing: ' + token)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate JavaScript and browser flows
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          inline = [x for x in re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', s, re.S) if x.strip()]
          Path('/tmp/app.js').write_text(inline[-1], encoding='utf-8')
          PY
          node --check /tmp/app.js
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium webkit >/dev/null
          python -m http.server 8000 >/tmp/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          cat >/tmp/check.cjs <<'JS'
          const fs=require('fs'),assert=require('assert'),{chromium,webkit}=require(process.cwd()+'/node_modules/playwright');
          const recipe=fs.readFileSync('recipe_master.json','utf8');
          const all=[[390,844],[820,1180],[1180,820],[1024,1366],[1366,1024]];
          async function pageAt(b,w,h){const p=await b.newPage({viewport:{width:w,height:h}});await p.route('https://raw.githubusercontent.com/**',r=>r.fulfill({status:200,contentType:'application/json',body:recipe}));await p.goto('http://127.0.0.1:8000/',{waitUntil:'domcontentloaded'});await p.locator('.menu-card').first().waitFor();return p}
          async function flow(b,w,h){
            const p=await pageAt(b,w,h);
            const home=await p.evaluate(()=>({sw:document.documentElement.scrollWidth,iw:innerWidth,pe:getComputedStyle(document.querySelector('#decor-layer')).pointerEvents,hero:document.querySelector('.hero').getBoundingClientRect().width,menus:document.querySelector('#app-menus').getBoundingClientRect().width,imgs:[...document.querySelectorAll('.decor-person')].map(e=>getComputedStyle(e).backgroundImage)}));
            assert(home.sw<=home.iw+1,`page overflow ${w}x${h}`);assert.equal(home.pe,'none');assert(home.imgs.every(x=>x.includes('ner-character-')));
            if(w<768){assert(home.hero<=332);assert(home.menus<=308)}
            await p.locator('.menu-card').first().click();await p.locator('#calculatorModal:not(.is-hidden)').waitFor();
            assert(await p.evaluate(()=>{const r=document.querySelector('#calculatorModal .modal-card').getBoundingClientRect();return r.left>=-1&&r.top>=-1&&r.right<=innerWidth+1&&r.bottom<=innerHeight+1}));
            if(w<1024){let q=await p.evaluate(()=>{const l=document.querySelector('#leftPanel').getBoundingClientRect(),r=document.querySelector('#rightPanel').getBoundingClientRect();return{lb:l.bottom,rt:r.top,d:getComputedStyle(document.querySelector('.calculator-body')).display}});assert.equal(q.d,'flex');assert(q.rt>=q.lb-2,`panels overlap before selection ${w}x${h}`)}
            const ex=p.locator('.exclude-btn').first();
            if(await ex.count()){
              await ex.click();await p.locator('.replacement-wrap').first().waitFor();
              assert(await p.evaluate(()=>{const row=document.querySelector('.exclude-item'),wrap=row?.querySelector('.replacement-wrap'),next=row?.nextElementSibling;return !row||!wrap||!next||wrap.getBoundingClientRect().bottom<=next.getBoundingClientRect().top+2}),'replacement overlaps next item');
              if(w<1024){let q=await p.evaluate(()=>{const l=document.querySelector('#leftPanel').getBoundingClientRect(),r=document.querySelector('#rightPanel').getBoundingClientRect();return{lb:l.bottom,rt:r.top}});assert(q.rt>=q.lb-2,`panels overlap after selection ${w}x${h}`)}
              const disabled=p.locator('.replacement-option.disabled');if(await disabled.count())assert(await disabled.first().isDisabled());
            }
            await p.locator('#closeCalculatorButton').click();await p.locator('#managerButton').click();await p.locator('#pinModal:not(.is-hidden)').waitFor();await p.locator('#cancelPinButton').click();
            await p.evaluate(()=>openMatrix());await p.locator('#matrixModal:not(.is-hidden) .matrix-table').waitFor();
            const m=await p.evaluate(()=>{const r=document.querySelector('#matrixModal .matrix-card').getBoundingClientRect(),s=document.querySelector('#tableContainer');const overflow=s.scrollWidth>s.clientWidth;if(overflow)s.scrollLeft=300;return{fit:r.left>=-1&&r.top>=-1&&r.right<=innerWidth+1&&r.bottom<=innerHeight+1,page:document.documentElement.scrollWidth<=innerWidth+1,overflow,scrolled:s.scrollLeft>0}});assert(m.fit&&m.page);if(m.overflow)assert(m.scrolled);
            await p.close();console.log('PASS',w+'x'+h);
          }
          async function rotate(b){const p=await pageAt(b,820,1180);await p.locator('.menu-card').first().click();assert.equal(await p.locator('.calculator-body').evaluate(e=>getComputedStyle(e).display),'flex');await p.setViewportSize({width:1180,height:820});await p.waitForTimeout(120);assert.equal(await p.locator('.calculator-body').evaluate(e=>getComputedStyle(e).display),'grid');await p.setViewportSize({width:820,height:1180});await p.waitForTimeout(120);assert.equal(await p.locator('.calculator-body').evaluate(e=>getComputedStyle(e).display),'flex');await p.close();console.log('PASS rotate')}
          (async()=>{for(const [name,engine,list] of [['chromium',chromium,all],['webkit',webkit,all.slice(0,3)]]){const b=await engine.launch({headless:true});try{for(const [w,h] of list)await flow(b,w,h);await rotate(b);console.log('ENGINE PASS',name)}finally{await b.close()}}})().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/check.cjs

      - name: Capture final screenshots
        run: |
          mkdir -p /tmp/final-review
          cat >/tmp/capture.cjs <<'JS'
          const fs=require('fs'),{chromium}=require(process.cwd()+'/node_modules/playwright');const recipe=fs.readFileSync('recipe_master.json','utf8');
          (async()=>{const b=await chromium.launch({headless:true});for(const [n,w,h] of [['iphone',390,844],['ipadp',820,1180],['ipadl',1180,820]]){const p=await b.newPage({viewport:{width:w,height:h}});await p.route('https://raw.githubusercontent.com/**',r=>r.fulfill({status:200,contentType:'application/json',body:recipe}));await p.goto('http://127.0.0.1:8000/',{waitUntil:'domcontentloaded'});await p.locator('.menu-card').first().waitFor();await p.screenshot({path:`/tmp/final-review/${n}-home.png`,fullPage:false});await p.locator('.menu-card').first().click();await p.screenshot({path:`/tmp/final-review/${n}-calc.png`,fullPage:false});const e=p.locator('.exclude-btn').first();if(await e.count()){await e.click();await p.screenshot({path:`/tmp/final-review/${n}-replace.png`,fullPage:false})}await p.close()}await b.close()})().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/capture.cjs

      - uses: actions/upload-artifact@v4
        with:
          name: final-real-device-review
          path: /tmp/final-review
          retention-days: 1

      - name: Commit verified UI and remove temporary workflows
        run: |
          rm -rf node_modules package.json package-lock.json
          git rm -f .github/workflows/final-ui-review-fix.yml .github/workflows/ui-visual-review.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix mobile calculator overlap and final mockup composition"
          git push origin HEAD:main
