name: Polish character edges
on:
  push:
    branches: [main]
    paths: [".github/workflows/character-edge-polish.yml"]
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Refine transparent character assets
        run: |
          python -m pip install --quiet pillow numpy
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import numpy as np
          for name in ('ner-character-top-left.png','ner-character-bottom-left.png','ner-character-right.png'):
              path=Path('assets')/name
              im=Image.open(path).convert('RGBA')
              a=np.asarray(im).astype(np.float32)
              rgb=a[:,:,:3]; old=a[:,:,3]/255.0
              border=np.concatenate((rgb[:4].reshape(-1,3),rgb[-4:].reshape(-1,3),rgb[:,:4].reshape(-1,3),rgb[:,-4:].reshape(-1,3)))
              bm=border.mean(1); bs=border.max(1)-border.min(1)
              cand=border[(bm>185)&(bs<80)]
              bg=np.median(cand,axis=0) if len(cand)>20 else np.array([248,242,233],dtype=np.float32)
              mean=rgb.mean(2); sat=rgb.max(2)-rgb.min(2)
              dist=np.sqrt(((rgb-bg)**2).sum(2))
              plate=np.clip((dist-24)/42,0,1)
              signal=np.maximum((255-mean)*1.2,sat*1.55)
              subject=np.clip((signal-34)/34,0,1)
              keep=np.maximum(plate,subject)
              bright=(mean>205)&(dist<55)
              keep[bright]=np.minimum(keep[bright],plate[bright]*0.35)
              strong=(mean<170)|(sat>85)
              keep[strong]=np.maximum(keep[strong],0.92)
              alpha=np.clip(old*keep,0,1); alpha[alpha<0.035]=0
              a[:,:,3]=alpha*255
              Image.fromarray(a.astype(np.uint8),'RGBA').save(path,optimize=True)
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          css='''\n/* CHARACTER EDGE POLISH 2026-09-23 */\n.decor-person{pointer-events:none!important;opacity:1!important;mix-blend-mode:multiply!important;filter:saturate(1.02) contrast(1.01)!important;background-repeat:no-repeat!important;background-position:center!important;background-size:contain!important}\n@media(max-width:767px){.decor-a{left:-14px!important;top:30px!important}.decor-b{left:-25px!important;top:790px!important}.decor-c{right:-32px!important;top:675px!important}}\n@media(min-width:768px) and (max-width:1023px){.decor-a{left:-8px!important;top:34px!important}.decor-b{left:-8px!important;top:825px!important}.decor-c{right:-4px!important;top:650px!important}}\n@media(min-width:1024px){.decor-a{left:4px!important;top:28px!important}.decor-b{left:4px!important;top:520px!important}.decor-c{right:4px!important;top:315px!important}}\n'''
          if 'CHARACTER EDGE POLISH 2026-09-23' in s: raise SystemExit('already polished')
          for t in ('selectable: qty > 0','option.disabled = true','function calculateNetRecipe','function renderMatrixTable'):
              if t not in s: raise SystemExit('logic token missing: '+t)
          p.write_text(s.replace('</style>',css+'\n</style>',1),encoding='utf-8')
          PY
      - name: Smoke test responsive layouts
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          x=[v for v in re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S) if v.strip()]
          Path('/tmp/app.js').write_text(x[-1],encoding='utf-8')
          PY
          node --check /tmp/app.js
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium webkit >/dev/null
          python -m http.server 8000 >/tmp/server.log 2>&1 &
          PID=$!; trap 'kill $PID || true' EXIT; sleep 2
          cat >/tmp/test.cjs <<'JS'
          const fs=require('fs'),assert=require('assert'),{chromium,webkit}=require(process.cwd()+'/node_modules/playwright');
          const recipe=fs.readFileSync('recipe_master.json','utf8'); const sizes=[[390,844],[820,1180],[1180,820]];
          async function run(engine){const b=await engine.launch({headless:true});for(const [w,h] of sizes){const p=await b.newPage({viewport:{width:w,height:h}});await p.route('https://raw.githubusercontent.com/**',r=>r.fulfill({status:200,contentType:'application/json',body:recipe}));await p.goto('http://127.0.0.1:8000/');await p.locator('.menu-card').first().waitFor();assert(await p.evaluate(()=>document.documentElement.scrollWidth<=innerWidth+1));assert.equal(await p.locator('#decor-layer').evaluate(e=>getComputedStyle(e).pointerEvents),'none');await p.locator('.menu-card').first().click();await p.locator('#calculatorModal:not(.is-hidden)').waitFor();if(w<1024){const q=await p.evaluate(()=>{const l=document.querySelector('#leftPanel').getBoundingClientRect(),r=document.querySelector('#rightPanel').getBoundingClientRect();return[l.bottom,r.top,getComputedStyle(document.querySelector('.calculator-body')).display]});assert.equal(q[2],'flex');assert(q[1]>=q[0]-2)}await p.close();console.log('PASS',w+'x'+h)}await b.close()};(async()=>{await run(chromium);await run(webkit)})().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/test.cjs
      - name: Capture visual review
        run: |
          mkdir -p /tmp/review
          python -m http.server 8000 >/tmp/server-capture.log 2>&1 &
          PID=$!; trap 'kill $PID || true' EXIT; sleep 2
          cat >/tmp/cap.cjs <<'JS'
          const fs=require('fs'),{chromium}=require(process.cwd()+'/node_modules/playwright');const recipe=fs.readFileSync('recipe_master.json','utf8');(async()=>{const b=await chromium.launch({headless:true});for(const [n,w,h] of [['iphone',390,844],['ipadp',820,1180],['ipadl',1180,820]]){const p=await b.newPage({viewport:{width:w,height:h}});await p.route('https://raw.githubusercontent.com/**',r=>r.fulfill({status:200,contentType:'application/json',body:recipe}));await p.goto('http://127.0.0.1:8000/');await p.locator('.menu-card').first().waitFor();await p.screenshot({path:`/tmp/review/${n}.png`});await p.close()}await b.close()})().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/cap.cjs
      - uses: actions/upload-artifact@v4
        with: {name: character-edge-review, path: /tmp/review, retention-days: 1}
      - name: Commit polished assets
        run: |
          rm -rf node_modules package.json package-lock.json
          rm -f .github/workflows/character-edge-polish.yml .github/workflows/final-ui-review-fix-3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish character cutouts after real-device review"
          git push origin HEAD:main
