name: Repair auto replacement QA contract

on:
  push:
    branches: [main]
    paths:
      - 'repair-staging/auto-replacement/RUN_QA_FIX'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch stale Chunk 4 replacement locator
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('qa/chunk4-polish-v4-contract.mjs')
          src = path.read_text(encoding='utf-8')
          old = """  const trigger = page.locator('.replacement-trigger').filter({hasText:candidate.replacement}).first();
  assert.equal(await trigger.count(), 1, `${scope}: replacement trigger missing (${candidate.replacement})`);
  await hitCheck(trigger, `${scope}/replacement-trigger`);
"""
          new = """  const trigger = target.locator('..').locator('.replacement-trigger');
  assert.equal(await trigger.count(), 1, `${scope}: replacement trigger missing for exclusion row (${candidate.exclude})`);
  assert.equal(await trigger.getAttribute('aria-expanded'), 'false', `${scope}: replacement picker auto-opened after exclusion`);
  assert.equal(await page.locator('.replacement-menu').count(), 0, `${scope}: replacement menu must stay closed until explicitly requested`);
  await hitCheck(trigger, `${scope}/replacement-trigger`);
  await trigger.click();
  assert.equal(await trigger.getAttribute('aria-expanded'), 'true', `${scope}: explicit replacement trigger did not open picker`);
  assert.ok(await target.locator('..').locator('.replacement-menu').count() > 0, `${scope}: explicit replacement picker missing from exclusion row`);
"""
          count = src.count(old)
          if count != 1:
              raise SystemExit(f'exact patch guard failed: expected 1 stale block, found {count}')
          path.write_text(src.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "qa/chunk4-polish-v4-contract.mjs"

      - name: Verify corrected safety semantics
        run: |
          grep -F "replacement trigger missing for exclusion row" qa/chunk4-polish-v4-contract.mjs
          grep -F "replacement picker auto-opened after exclusion" qa/chunk4-polish-v4-contract.mjs
          grep -F "explicit replacement trigger did not open picker" qa/chunk4-polish-v4-contract.mjs
          ! grep -F "replacement trigger missing (${candidate.replacement})" qa/chunk4-polish-v4-contract.mjs

      - name: Commit QA-only correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qa/chunk4-polish-v4-contract.mjs
          git commit -m 'Align Chunk 4 safety with silent auto replacement'
          git push origin HEAD:main
