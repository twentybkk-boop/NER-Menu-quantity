name: Audit import data integrity

on:
  push:
    paths:
      - 'repair-staging/import-validation/RUN_AUDIT'

permissions:
  contents: read

jobs:
  audit-import-data-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit current recipe and replacement linkage
        run: node qa/import-data-integrity-audit.mjs
