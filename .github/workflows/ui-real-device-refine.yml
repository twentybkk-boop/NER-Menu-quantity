name: Refine UI from real device review

on:
  push:
    branches: [main]
    paths: [".github/workflows/ui-real-device-refine.yml"]

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply real-device presentation refinements
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* REAL DEVICE REVIEW OVERRIDES 2026-09-23 */'
          if marker in s:
              raise SystemExit('real-device override already applied')

          s = s.replace(
              'ระบบคำนวณวัตถุดิบสุทธิ (จัดลำดับ Default เลือกตัวแทนหมวดเดียวกันอัตโนมัติ)',
              'ระบบคำนวณวัตถุดิบสุทธิ สำหรับร้านแจ่วฮ้อน',
              1,
          )
          s = s.replace("${single ? 'วัตถุดิบเดี่ยว' : 'จัดการสูตรตัดออก'}", "${single ? 'พร้อมจัดเสิร์ฟ' : 'ปรับวัตถุดิบ'}", 1)

          css = r'''
          /* REAL DEVICE REVIEW OVERRIDES 2026-09-23 */
          /* The source art is one 540x360 composite. Treat it as three crop windows,
             never as a full-page background. */
          #decor-layer {
            position: absolute !important;
            inset: 0 0 auto 0 !important;
            width: 100% !important;
            height: 980px !important;
            overflow: hidden !important;
            pointer-events: none !important;
            z-index: 4 !important;
          }
          .decor-person {
            position: absolute !important;
            background-image: url('assets/ner-team-bg.webp') !important;
            background-repeat: no-repeat !important;
            background-size: 540px 360px !important;
            opacity: 1 !important;
            filter: saturate(1.02) contrast(1.015) !important;
            -webkit-mask-image: none !important;
            mask-image: none !important;
            pointer-events: none !important;
          }
          .decor-a {
            width: 170px !important; height: 195px !important;
            left: -22px !important; right: auto !important;
            top: 26px !important; bottom: auto !important;
            background-position: 0 0 !important;
          }
          .decor-b {
            width: 170px !important; height: 188px !important;
            left: -22px !important; right: auto !important;
            top: 690px !important; bottom: auto !important;
            background-position: 0 -166px !important;
          }
          .decor-c {
            width: 170px !important; height: 262px !important;
            left: auto !important; right: -20px !important;
            top: 540px !important; bottom: auto !important;
            background-position: -370px -68px !important;
          }

          #app-shell { position: relative; z-index: 20; }
          .hero { isolation: isolate; }
          .hero, .menu-card, .category-title { position: relative; z-index: 1; }
          .brand-subtitle { max-width: 460px; }
          .menu-card { transition: transform .12s ease, box-shadow .12s ease; }
          .menu-card:active { transform: scale(.992); }

          .modal-card {
            background: #fffdf9;
            border: 1px solid #eadbcf;
            box-shadow: 0 24px 70px rgba(55, 37, 29, .24);
          }
          .modal-header {
            position: sticky;
            top: 0;
            z-index: 6;
            background: rgba(255,253,249,.98);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
          }
          #leftPanel { background: #fffdf9; }
          #rightPanel { background: #f8f1e7; }
          .panel-title { margin-bottom: 12px; }
          .exclude-item { margin-bottom: 8px; }
          .exclude-btn {
            min-height: 46px;
            padding: 10px 12px;
            border: 1px solid #eadbcf;
            border-radius: 13px;
            background: #fff;
            box-shadow: 0 3px 10px rgba(73,49,38,.035);
          }
          .exclude-btn.is-excluded {
            background: #fff1f1;
            border-color: #e6b9bd;
          }
          .replacement-wrap {
            margin: 7px 0 2px;
            padding: 8px;
            border-left: 3px solid #caa690;
            border-radius: 0 13px 13px 0;
            background: #fbf4eb;
          }
          .replacement-trigger {
            min-height: 44px;
            border-radius: 11px;
            background: #fff;
          }
          .replacement-menu {
            margin-top: 6px;
            border: 1px solid #eadbcf;
            border-radius: 11px;
            background: #fff;
            box-shadow: none;
          }
          .replacement-option { min-height: 43px; }
          .net-card {
            min-height: 52px;
            border: 1px solid #eadbcf;
            background: #fff;
            box-shadow: 0 3px 10px rgba(73,49,38,.035);
          }

          #tableContainer {
            --matrix-col-1: 88px;
            --matrix-col-2: 92px;
            --matrix-data-col: 52px;
            max-width: 100%;
            overflow: auto;
            -webkit-overflow-scrolling: touch;
          }
          .matrix-table th, .matrix-table td { padding: 3px 2px; }

          @media (max-width: 767px) {
            #decor-layer { height: 900px !important; }
            #app-shell { width: min(calc(100% - 46px), 620px) !important; }
            .brand-masthead {
              width: min(270px, 78vw) !important;
              min-height: 146px !important;
              margin-left: auto !important;
              margin-right: 12px !important;
            }
            .brand-mark { font-size: 56px !important; }
            .brand-note { max-width: 220px; line-height: 1.35; }
            .decor-a {
              width: 162px !important; height: 188px !important;
              left: -28px !important; top: 22px !important;
            }
            .decor-b {
              width: 164px !important; height: 184px !important;
              left: -30px !important; top: 694px !important;
            }
            .decor-c {
              width: 164px !important; height: 250px !important;
              right: -30px !important; top: 548px !important;
            }
            .hero { padding: 19px 16px !important; }
            .brand-title { font-size: 22px !important; }
            .brand-subtitle { font-size: 12px !important; }
            #app-menus { margin-top: 22px !important; }
            .menu-card { min-height: 72px !important; }
            .modal-card { border-radius: 18px !important; }
            .modal-header { padding: 13px 14px !important; }
            .modal-title { font-size: 20px !important; }
            .calc-panel { padding: 13px !important; }
            #netResultList { grid-template-columns: 1fr !important; }
            #tableContainer {
              --matrix-col-1: 72px;
              --matrix-col-2: 76px;
              --matrix-data-col: 48px;
              padding: 2px !important;
            }
            .matrix-table { font-size: 8.25px !important; }
            .matrix-table th { font-size: 7.25px !important; }
          }

          @media (min-width: 768px) and (max-width: 1023px) {
            #decor-layer { height: 1180px !important; }
            #app-shell { width: min(calc(100% - 100px), 720px) !important; }
            #app-menus { width: min(700px,100%) !important; }
            .decor-person { background-size: 600px 400px !important; }
            .decor-a {
              width: 190px !important; height: 218px !important;
              left: -18px !important; top: 46px !important;
              background-position: 0 0 !important;
            }
            .decor-b {
              width: 190px !important; height: 208px !important;
              left: -18px !important; top: 845px !important;
              background-position: 0 -184px !important;
            }
            .decor-c {
              width: 190px !important; height: 292px !important;
              right: -16px !important; top: 690px !important;
              background-position: -411px -76px !important;
            }
            #tableContainer {
              --matrix-col-1: 84px;
              --matrix-col-2: 88px;
              --matrix-data-col: 50px;
            }
          }

          @media (min-width: 1024px) {
            #decor-layer { height: 820px !important; }
            #app-shell { width: min(840px, calc(100% - 300px)) !important; }
            #app-menus { width: min(760px,100%) !important; }
            .menu-grid { grid-template-columns: repeat(2,minmax(0,1fr)) !important; }
            .decor-person { background-size: 720px 480px !important; }
            .decor-a {
              width: 220px !important; height: 258px !important;
              left: 4px !important; top: 44px !important;
              background-position: 0 0 !important;
            }
            .decor-b {
              width: 220px !important; height: 245px !important;
              left: 6px !important; top: 546px !important;
              background-position: 0 -220px !important;
            }
            .decor-c {
              width: 220px !important; height: 330px !important;
              right: 4px !important; top: 385px !important;
              background-position: -500px -92px !important;
            }
            .brand-masthead { width: min(500px,100%) !important; }
            .hero { width: min(620px,100%) !important; }
            #tableContainer {
              --matrix-col-1: 96px;
              --matrix-col-2: 100px;
              --matrix-data-col: 54px;
            }
          }
          '''

          if '</style>' not in s:
              raise SystemExit('style close not found')
          s = s.replace('</style>', css + '\n</style>', 1)

          for token in (
              'selectable: qty > 0',
              'option.disabled = true',
              'function calculateNetRecipe',
              'function renderMatrixTable',
              'pointer-events: none !important',
          ):
              if token not in s:
                  raise SystemExit('required token missing: ' + token)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate interactions and capture reviewed UI
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          inline=[x for x in re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S) if x.strip()]
          Path('/tmp/app.js').write_text(inline[-1],encoding='utf-8')
          PY
          node --check /tmp/app.js
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          python -m http.server 8000 >/tmp/server.log 2>&1 &
          PID=$!; trap 'kill $PID || true' EXIT; sleep 2
          cat >/tmp/verify.cjs <<'JS'
          const fs=require('fs'),assert=require('assert'),{chromium}=require(process.cwd()+'/node_modules/playwright');
          const recipe=fs.readFileSync('recipe_master.json','utf8');
          const sizes=[['iphone',390,844],['ipadp',820,1180],['ipadl',1180,820],['ipadp2',1024,1366],['ipadl2',1366,1024]];
          async function pageAt(b,w,h){const p=await b.newPage({viewport:{width:w,height:h}});await p.route('https://raw.githubusercontent.com/**',r=>r.fulfill({status:200,contentType:'application/json',body:recipe}));await p.goto('http://127.0.0.1:8000/',{waitUntil:'domcontentloaded'});await p.locator('.menu-card').first().waitFor();return p}
          async function run(){fs.mkdirSync('/tmp/review',{recursive:true});const b=await chromium.launch({headless:true});try{for(const [name,w,h] of sizes){const p=await pageAt(b,w,h);const state=await p.evaluate(()=>({sw:document.documentElement.scrollWidth,iw:innerWidth,pe:getComputedStyle(document.querySelector('#decor-layer')).pointerEvents,pos:getComputedStyle(document.querySelector('#decor-layer')).position}));assert(state.sw<=state.iw+1,`page overflow ${w}x${h}`);assert.equal(state.pe,'none');assert.equal(state.pos,'absolute');await p.screenshot({path:`/tmp/review/${name}-home.png`,fullPage:false});await p.locator('.menu-card').first().click();await p.locator('#calculatorModal:not(.is-hidden)').waitFor();assert(await p.evaluate(()=>{const r=document.querySelector('#calculatorModal .modal-card').getBoundingClientRect();return r.left>=-1&&r.top>=-1&&r.right<=innerWidth+1&&r.bottom<=innerHeight+1}));await p.screenshot({path:`/tmp/review/${name}-calc.png`,fullPage:false});const ex=p.locator('.exclude-btn').first();if(await ex.count()){await ex.click();await p.locator('.replacement-wrap').first().waitFor();assert(await p.evaluate(()=>{const row=document.querySelector('.exclude-item'),wrap=row?.querySelector('.replacement-wrap'),next=row?.nextElementSibling;if(!row||!wrap||!next)return true;return wrap.getBoundingClientRect().bottom<=next.getBoundingClientRect().top+2}),'replacement overlap');await p.screenshot({path:`/tmp/review/${name}-replace.png`,fullPage:false});}await p.locator('#closeCalculatorButton').click();await p.locator('#managerButton').click();await p.locator('#pinInput').fill('206738');await p.locator('#verifyPinButton').click();await p.locator('#matrixModal:not(.is-hidden)').waitFor();await p.locator('.matrix-table').waitFor();const m=await p.evaluate(()=>{const s=document.querySelector('#tableContainer');s.scrollLeft=300;return{scroll:s.scrollWidth>s.clientWidth&&s.scrollLeft>0,page:document.documentElement.scrollWidth<=innerWidth+1}});assert(m.scroll,`matrix not scrollable ${w}x${h}`);assert(m.page,`matrix caused page overflow ${w}x${h}`);await p.close();console.log('PASS',w+'x'+h)}const p=await pageAt(b,820,1180);await p.locator('.menu-card').first().click();assert.equal(await p.locator('.calculator-body').evaluate(e=>getComputedStyle(e).display),'flex');await p.setViewportSize({width:1180,height:820});await p.waitForTimeout(120);assert.equal(await p.locator('.calculator-body').evaluate(e=>getComputedStyle(e).display),'grid');assert(await p.evaluate(()=>document.documentElement.scrollWidth<=innerWidth+1));await p.setViewportSize({width:820,height:1180});await p.waitForTimeout(120);assert.equal(await p.locator('.calculator-body').evaluate(e=>getComputedStyle(e).display),'flex');await p.close();console.log('PASS rotate')}finally{await b.close()}}
          run().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/verify.cjs

      - uses: actions/upload-artifact@v4
        with:
          name: real-device-refinement-review
          path: /tmp/review
          retention-days: 1

      - name: Commit verified refinement
        run: |
          rm -rf node_modules package.json package-lock.json
          rm -f .github/workflows/ui-real-device-refine.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/ui-real-device-refine.yml
          git commit -m "Refine UI from real-device review"
          git push origin HEAD:main
