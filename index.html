<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NER แจ่วฮ้อน - เช็ควัตถุดิบ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
    body { font-family: 'Plus+Jakarta+Sans', sans-serif; background-color: #f1f5f9; }
  </style>
</head>
<body class="p-4 md:p-8 max-w-6xl mx-auto">
  
  <div class="flex justify-between items-center mb-6 bg-white p-5 rounded-3xl shadow-sm border border-slate-100">
    <div>
      <h1 class="text-xl font-bold text-slate-800">NER แจ่วฮ้อน</h1>
      <p class="text-xs text-slate-500">ระบบเช็คปริมาณวัตถุดิบมาตรฐาน</p>
    </div>
    <button onclick="openEditModal()" class="bg-slate-900 text-white px-4 py-2.5 rounded-2xl text-xs font-semibold shadow-md active:scale-95 transition flex items-center gap-2">
      <span>⚙️</span> แก้ไขข้อมูล (ใส่รหัส)
    </button>
  </div>

  <div id="loading" class="text-center py-20 text-slate-400 font-medium">กำลังโหลดข้อมูล...</div>
  <div id="app" class="space-y-6"></div>

  <!-- Modal Passcode -->
  <div id="pinModal" class="fixed inset-0 bg-black/40 backdrop-blur-xs hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-3xl p-6 w-full max-w-sm shadow-2xl border border-slate-100">
      <h3 class="text-lg font-bold text-slate-800 mb-1">ยืนยันรหัสผ่านผู้จัดการ</h3>
      <p class="text-xs text-slate-500 mb-4">ใส่รหัสผ่านเพื่อเข้าหน้าแก้ไขข้อมูลหลังบ้าน</p>
      <input type="password" id="pinInput" placeholder="••••••" maxlength="6" class="w-full px-4 py-3 border border-slate-200 rounded-2xl text-center text-2xl tracking-widest mb-4 focus:outline-none focus:ring-2 focus:ring-slate-900 bg-slate-50">
      <div class="flex gap-2">
        <button onclick="closePinModal()" class="flex-1 bg-slate-100 text-slate-600 py-3 rounded-2xl font-semibold text-xs">ยกเลิก</button>
        <button onclick="verifyPin()" class="flex-1 bg-slate-900 text-white py-3 rounded-2xl font-semibold text-xs">ยืนยัน</button>
      </div>
    </div>
  </div>

  <script>
    fetch('data.json')
      .then(res => res.json())
      .then(data => renderApp(data))
      .catch(err => {
        document.getElementById('loading').innerText = 'ไม่สามารถโหลดข้อมูลได้';
      });

    function renderApp(menuData) {
      document.getElementById('loading').style.display = 'none';
      const app = document.getElementById('app');
      app.innerHTML = '';

      const categories = [...new Set(menuData.map(row => row.category))];

      categories.forEach(cat => {
        const catDiv = document.createElement('div');
        catDiv.className = 'bg-white rounded-3xl p-5 md:p-6 shadow-sm border border-slate-100';
        
        let html = `<h2 class="text-lg font-bold text-slate-800 mb-4 pb-3 border-b border-slate-100 flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-slate-900"></span>${cat}</h2><div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">`;

        const items = menuData.filter(row => row.category === cat);
        items.forEach(item => {
          const validIngredients = Object.entries(item.ingredients).filter(([k, v]) => v && v !== '-' && v !== 0 && v !== '0');
          
          html += `
            <div class="bg-slate-50 rounded-2xl p-4 border border-slate-100/80 flex flex-col justify-between">
              <div>
                <h3 class="font-bold text-slate-900 text-base mb-3 border-b border-slate-200/60 pb-2">${item.name}</h3>
                <div class="flex flex-wrap gap-1.5 mb-2">
          `;

          validIngredients.forEach(([ingName, val]) => {
            html += `<span class="bg-white text-slate-700 text-xs px-2.5 py-1.5 rounded-xl border border-slate-200/80 font-medium shadow-2xs"><b>${ingName}:</b> ${val}</span>`;
          });

          html += `</div></div></div>`;
        });

        html += `</div>`;
        catDiv.innerHTML = html;
        app.appendChild(catDiv);
      });
    }

    function openEditModal() {
      document.getElementById('pinModal').classList.remove('hidden');
      document.getElementById('pinInput').value = '';
      document.getElementById('pinInput').focus();
    }

    function closePinModal() {
      document.getElementById('pinModal').classList.add('hidden');
    }

    function verifyPin() {
      const pin = document.getElementById('pinInput').value;
      if (pin === '206738') {
        closePinModal();
        // พาไปหน้าแก้ไฟล์ data.json บน GitHub โดยตรง
        alert('รหัสผ่านถูกต้อง! ระบบจะพาไปหน้าแก้ไขข้อมูลหลังบ้าน');
        location.href = 'https://github.com/' + location.pathname.split('/')[1] + '/' + location.pathname.split('/')[2] + '/blob/main/data.json';
      } else {
        alert('รหัสผ่านไม่ถูกต้อง');
        document.getElementById('pinInput').value = '';
        document.getElementById('pinInput').focus();
      }
    }
  </script>
</body>
</html>
